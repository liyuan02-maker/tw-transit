# Cloudflare Worker 設定（tw-transit-api）
# 金鑰（TDX_ID、TDX_SECRET、GOOGLE_KEY）放在 Cloudflare 的祕密裡，不寫在這裡
name = "tw-transit-api"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# 存 TDX 登入憑證
[[kv_namespaces]]
binding = "TOKEN_KV"
id = "a98c41774471438b9cbb5220f7c3a8d5"

# 每 5 分鐘檢查一次 TDX 憑證
[triggers]
crons = ["*/5 * * * *"]

# GitHub Actions 送 TDX 憑證時用的密碼指紋（不是密碼本身，公開沒關係）
[vars]
ADMIN_KEY_SHA256 = "2ffafad34e9693aa2be34e7dc0b9d04ad7e57a8338366182410c06f61b20dbb5"
