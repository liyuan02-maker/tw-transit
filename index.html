<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2230">
<title>台灣大眾運輸通</title>
<style>
:root{
  --ink:#1c2230; --mute:#6b7280; --line:#e6e1d6; --card:#fff; --bg:#f6f4ef;
  --bike:#f2a900; --bus:#0e9f8e; --mrt:#0070bd; --tra:#1f3a8a; --hsr:#e8590c; --walk:#2f855a;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:fixed;inset:0;background:#e5e3df}

/* 上方搜尋列 */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;z-index:5;pointer-events:none}
.search{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;gap:6px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.15);padding:6px}
.search input{flex:1;min-width:0;border:0;font:inherit;font-size:16px;padding:10px 10px;outline:none;background:transparent}
.search button{border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
#goBtn{background:var(--ink);color:#fff;padding:0 16px}
.fab{position:fixed;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);font-size:20px;cursor:pointer}
#locBtn{bottom:calc(var(--sheet-h) + 12px)}
#areaBtn{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 74px);z-index:5;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:9px 16px;box-shadow:0 3px 12px rgba(0,0,0,.25);cursor:pointer;display:none}

/* 下方抽屜 */
:root{--sheet-h:42vh}
.sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:6;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.big{--sheet-h:86vh;height:86vh}
.sheet.small{height:92px}
.grab{padding:8px 0 4px;cursor:pointer;display:flex;justify-content:center}
.grab span{width:42px;height:5px;border-radius:3px;background:#cfc8b8}
.tabs{display:flex;gap:6px;padding:0 14px 10px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.body{flex:1;overflow-y:auto;padding:0 14px 20px;-webkit-overflow-scrolling:touch}
.sec{margin:6px 0 16px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 8px}
.sec h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sec h3 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.card.tap{cursor:pointer}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.row{display:flex;align-items:center;gap:10px}
.num{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;font-size:13px}
.steps .w{color:var(--mute)}
.eta{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin-top:8px}
.eta b{font-variant-numeric:tabular-nums}
.soon{color:var(--bad)}
.trains{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.trains td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.trains td:last-child{text-align:right}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
.err{color:var(--bad);font-size:13px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #ddd;border-top-color:var(--ink);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.notice{background:#fff7e6;border:1px solid #f5d9a8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}

/* 地圖上的 YouBike 標記 */
.bk{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--c);border-radius:999px;padding:2px 7px 2px 4px;font:700 12px/1.2 system-ui,sans-serif;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;cursor:pointer}
.bk .ic{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:11px}
.bk .sp{color:var(--mute);font-weight:500}
.busdot{width:14px;height:14px;border-radius:50%;background:var(--bus);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.2)}
.dest{font-size:28px;transform:translateY(4px)}
#setup{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;padding:24px;overflow:auto}
#setup code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <form class="search" id="form">
    <input id="dest" placeholder="要去哪裡？例如：台中車站、高雄巨蛋" autocomplete="off" enterkeyhint="search">
    <button id="goBtn" type="submit">出發</button>
  </form>
</div>
<button id="areaBtn">🔄 查這一區</button>
<button class="fab" id="locBtn" title="回到我的位置">◎</button>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"><span></span></div>
  <div class="tabs">
    <button data-t="near" class="on">附近</button>
    <button data-t="route">路線</button>
  </div>
  <div class="body" id="body"></div>
</div>

<div id="setup">
  <h2>還差一步：設定金鑰</h2>
  <p>伺服器沒有讀到 <code>GOOGLE_BROWSER_KEY</code>。請依照 README 申請 Google 與 TDX 金鑰，填進 <code>.env</code> 後重新啟動 <code>node server.js</code>。</p>
</div>

<script src="/config.js"></script>
<script>
// ====== 狀態 ======
const S = {
  tab: "near",
  me: null,            // 我的位置 {lat, lon}
  area: null,          // 目前查詢附近資料的中心
  located: false,
  bikes: [], buses: [], nearErr: null, nearLoading: false,
  plan: null, planErr: null, planLoading: false, destText: "",
  selected: null,      // 被點選的路線
};
let map, M = {}, bikeMarkers = [], busMarkers = [], meMarker, destMarker, routeLine, timer;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm = iso => iso ? new Date(iso).toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit", hour12:false, timeZone:"Asia/Taipei"}) : "--:--";
const minsFromNow = iso => Math.round((new Date(iso) - Date.now()) / 60000);
function hmDiff(hmStr){ // "08:15" 距離現在幾分鐘（台北時間）
  const now = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  const [h,m] = hmStr.split(":").map(Number);
  return h*60+m - (now.getHours()*60+now.getMinutes());
}
const rel = m => m <= 0 ? "即將" : m < 60 ? `${m} 分後` : `${Math.floor(m/60)} 小時 ${m%60} 分後`;

async function api(path){
  const r = await fetch(path);
  const j = await r.json().catch(() => ({error: "伺服器回應錯誤"}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ====== 地圖 ======
function loadGoogle(){
  if (!window.GOOGLE_BROWSER_KEY){ $("setup").style.display = "block"; return; }
  const s = document.createElement("script");
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_BROWSER_KEY)}&v=weekly&language=zh-TW&region=TW&libraries=marker,geometry&callback=initMap`;
  s.async = true;
  document.head.appendChild(s);
}

window.initMap = async () => {
  M = await google.maps.importLibrary("marker");
  map = new google.maps.Map($("map"), {
    center: {lat: 25.0478, lng: 121.5170}, zoom: 16,
    mapId: "DEMO_MAP_ID",           // 可換成你自己的 Map ID
    disableDefaultUI: true, clickableIcons: false, gestureHandling: "greedy",
  });
  map.addListener("idle", () => {
    if (!S.area) return;
    const c = map.getCenter();
    const far = google.maps.geometry.spherical.computeDistanceBetween(c, new google.maps.LatLng(S.area.lat, S.area.lon)) > 400;
    $("areaBtn").style.display = far && map.getZoom() >= 14 ? "block" : "none";
  });
  locate();
};

function el(html){ const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

function locate(){
  if (!navigator.geolocation){ useFallback("此瀏覽器不支援定位"); return; }
  navigator.geolocation.getCurrentPosition(p => {
    S.me = {lat: p.coords.latitude, lon: p.coords.longitude};
    S.located = true;
    placeMe();
    map.panTo({lat: S.me.lat, lng: S.me.lon}); map.setZoom(16);
    loadNear(S.me);
  }, e => useFallback(e.code === 1 ? "你沒有允許定位" : "無法取得定位"), {enableHighAccuracy: true, timeout: 10000, maximumAge: 30000});
}
function useFallback(msg){
  S.me = {lat: 25.0478, lon: 121.5170}; S.located = false; S.locMsg = msg + "，先以台北車站為起點。";
  placeMe(); map.panTo({lat: S.me.lat, lng: S.me.lon});
  loadNear(S.me);
}
function placeMe(){
  if (meMarker) meMarker.map = null;
  meMarker = new M.AdvancedMarkerElement({map, position: {lat: S.me.lat, lng: S.me.lon}, content: el(`<div class="me"></div>`), zIndex: 999});
}

// ====== 附近：YouBike + 公車 ======
async function loadNear(pt, quiet){
  S.area = pt; $("areaBtn").style.display = "none";
  if (!quiet){ S.nearLoading = true; render(); }
  const q = `lat=${pt.lat}&lon=${pt.lon}`;
  const [b, u] = await Promise.allSettled([api("/api/bike?" + q), api("/api/bus?" + q)]);
  S.bikes = b.status === "fulfilled" ? b.value : [];
  S.buses = u.status === "fulfilled" ? u.value : [];
  S.nearErr = [b, u].filter(x => x.status === "rejected").map(x => x.reason.message).join("；") || null;
  S.nearLoading = false;
  drawNearMarkers(); render();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden && S.area) loadNear(S.area, true); }, 30000);
}

function bikeColor(b){
  if (b.service !== 1) return "#9ca3af";
  if (!b.bikes) return "var(--bad)";
  if (b.bikes < 3) return "var(--warn)";
  return "var(--ok)";
}

function drawNearMarkers(){
  bikeMarkers.forEach(m => m.map = null); busMarkers.forEach(m => m.map = null);
  bikeMarkers = S.bikes.map(b => {
    const m = new M.AdvancedMarkerElement({
      map, position: {lat: b.lat, lng: b.lon}, title: b.name,
      content: el(`<div class="bk" style="--c:${bikeColor(b)}"><span class="ic">🚲</span>${b.bikes ?? "?"}<span class="sp">/ 空${b.docks ?? "?"}</span></div>`),
    });
    m.addListener("click", () => { openSheet(); S.tab = "near"; S.focusBike = b.id; render(); document.querySelector(`[data-bike="${CSS.escape(b.id)}"]`)?.scrollIntoView({behavior:"smooth", block:"center"}); });
    return m;
  });
  busMarkers = S.buses.map(s => new M.AdvancedMarkerElement({map, position: {lat: s.lat, lng: s.lon}, title: s.name, content: el(`<div class="busdot"></div>`)}));
}

// ====== 路線規劃 ======
async function doPlan(text){
  if (!S.me){ return; }
  S.destText = text; S.tab = "route"; S.planLoading = true; S.plan = null; S.planErr = null; S.selected = null;
  clearRoute(); openSheet(true); render();
  try {
    S.plan = await api(`/api/plan?lat=${S.me.lat}&lon=${S.me.lon}&to=${encodeURIComponent(text)}`);
    const t = S.plan.to;
    if (destMarker) destMarker.map = null;
    destMarker = new M.AdvancedMarkerElement({map, position: {lat: t.lat, lng: t.lon}, title: t.name, content: el(`<div class="dest">📍</div>`)});
    const bounds = new google.maps.LatLngBounds();
    bounds.extend({lat: S.me.lat, lng: S.me.lon}); bounds.extend({lat: t.lat, lng: t.lon});
    map.fitBounds(bounds, {top: 90, bottom: window.innerHeight * 0.5, left: 30, right: 30});
  } catch (e) { S.planErr = e.message; }
  S.planLoading = false; render();
}

function clearRoute(){ if (routeLine){ routeLine.setMap(null); routeLine = null; } }
function showRoute(key){
  clearRoute(); S.selected = key;
  const [kind, i] = key.split(":");
  const r = S.plan?.[kind]?.v?.[+i];
  if (r?.polyline){
    const path = google.maps.geometry.encoding.decodePath(r.polyline);
    routeLine = new google.maps.Polyline({map, path, strokeColor: kind === "bus" ? "#0e9f8e" : "#0070bd", strokeWeight: 6, strokeOpacity: .9});
    const b = new google.maps.LatLngBounds(); path.forEach(p => b.extend(p));
    map.fitBounds(b, {top: 90, bottom: window.innerHeight * 0.45, left: 30, right: 30});
  }
  render();
}

// ====== 畫面 ======
const VEH = {BUS:["🚌","var(--bus)"], INTERCITY_BUS:["🚌","var(--bus)"], TROLLEYBUS:["🚌","var(--bus)"],
  SUBWAY:["🚇","var(--mrt)"], METRO_RAIL:["🚇","var(--mrt)"], LIGHT_RAIL:["🚊","var(--mrt)"], TRAM:["🚊","var(--mrt)"],
  HEAVY_RAIL:["🚆","var(--tra)"], COMMUTER_TRAIN:["🚆","var(--tra)"], RAIL:["🚆","var(--tra)"], HIGH_SPEED_TRAIN:["🚄","var(--hsr)"]};

function stepsHtml(parts){
  return `<div class="steps">${parts.map(p => p.kind === "walk"
    ? (p.sec >= 60 ? `<span class="w">🚶${Math.round(p.sec/60)}分</span>` : "")
    : (() => { const [ic, c] = VEH[p.vehicle] || ["🚍","#555"];
        return `<span class="pill" style="background:${p.color || c};color:${p.textColor || "#fff"}">${ic} ${esc(p.line)}</span>`; })()
  ).filter(Boolean).join(`<span class="w">›</span>`)}</div>`;
}

function routeCard(kind, r, i){
  const first = r.parts.find(p => p.kind === "transit");
  const m = minsFromNow(r.firstDep);
  const key = `${kind}:${i}`;
  return `<div class="card tap ${S.selected === key ? "sel" : ""}" data-route="${key}">
    <div class="row">
      <div><div class="num">${hm(r.firstDep)}</div><div class="mute">${rel(m)}開</div></div>
      <div style="flex:1">
        <div><b>${esc(first.line)}</b> <span class="mute">往 ${esc(first.headsign || first.to)}</span></div>
        <div class="mute">走 ${r.walkToStop} 分鐘到「${esc(first.from)}」</div>
      </div>
      <div style="text-align:right"><div><b>${hm(r.arrive)}</b></div><div class="mute">到達</div></div>
    </div>
    ${stepsHtml(r.parts)}
    ${m < r.walkToStop ? `<div class="err" style="margin-top:6px">⚠️ 走過去可能趕不上</div>` : ""}
  </div>`;
}

function railSec(kind, title, color, res){
  let inner;
  if (!res) inner = "";
  else if (!res.ok) inner = `<div class="err">${esc(res.e)}</div>`;
  else if (res.v.note) inner = `<div class="empty">${esc(res.v.note)}</div>`;
  else {
    const {from, to, trains} = res.v;
    inner = `<div class="card">
      <div><b>${esc(from.name)}</b> → <b>${esc(to.name)}</b></div>
      <div class="mute">最近車站距你 ${(from.dist/1000).toFixed(1)} 公里（步行約 ${Math.round(from.dist/75)} 分）；目的地距 ${esc(to.name)} ${(to.dist/1000).toFixed(1)} 公里</div>
      ${trains.length ? `<table class="trains">${trains.map(t => `<tr>
        <td><b>${esc(t.dep)}</b> → ${esc(t.arr)}</td>
        <td class="mute">${esc(t.type)} ${esc(t.no)}次</td>
        <td class="mute">${rel(hmDiff(t.dep))}</td></tr>`).join("")}</table>`
        : `<div class="empty">今天已經沒有班次了</div>`}
    </div>`;
  }
  return `<div class="sec"><h3><i style="background:${color}"></i>${title}<small>接下來 3 班</small></h3>${inner}</div>`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === S.tab));
  let h = "";
  if (S.tab === "near"){
    if (S.locMsg && !S.located) h += `<div class="notice">📍 ${esc(S.locMsg)}</div>`;
    if (S.nearLoading) h += `<div class="empty"><span class="spin"></span> 讀取附近資料…</div>`;
    if (S.nearErr) h += `<div class="err">${esc(S.nearErr)}</div>`;
    // 公車
    h += `<div class="sec"><h3><i style="background:var(--bus)"></i>最近的公車站牌<small>每 30 秒更新</small></h3>`;
    h += S.buses.length ? S.buses.map(s => `<div class="card">
        <div class="row"><b style="flex:1">${esc(s.name)}</b><span class="mute">🚶 ${s.walk} 分（${s.dist} m）</span></div>
        ${s.arrivals.length ? `<div class="eta">${s.arrivals.slice(0, 8).map(a => `
          <span>${esc(a.route)}</span>
          <b class="${a.min != null && a.min <= 3 ? "soon" : ""}">${a.min != null ? (a.min <= 1 ? "進站中" : a.min + " 分") : `<span class="mute">${esc(a.status)}</span>`}</b>`).join("")}</div>`
          : `<div class="empty">目前沒有到站資料</div>`}
      </div>`).join("") : (S.nearLoading ? "" : `<div class="empty">附近 400 公尺內沒有公車站</div>`);
    h += `</div>`;
    // YouBike
    h += `<div class="sec"><h3><i style="background:var(--bike)"></i>附近 YouBike<small>可借 / 可還</small></h3>`;
    h += S.bikes.length ? S.bikes.map(b => `<div class="card ${S.focusBike === b.id ? "sel" : ""}" data-bike="${esc(b.id)}">
        <div class="row">
          <div style="flex:1"><b>${esc(b.name)}</b><div class="mute">🚶 ${b.walk} 分（${b.dist} m）${b.service !== 1 ? " · 暫停營運" : ""}</div></div>
          <div style="text-align:center"><div class="num" style="color:${bikeColor(b)}">${b.bikes ?? "?"}</div><div class="mute">可借</div></div>
          <div style="text-align:center"><div class="num">${b.docks ?? "?"}</div><div class="mute">空位</div></div>
        </div></div>`).join("") : (S.nearLoading ? "" : `<div class="empty">附近 600 公尺內沒有 YouBike 站</div>`);
    h += `</div>`;
  } else {
    if (!S.destText && !S.planLoading) h += `<div class="empty">在上方輸入目的地，就會列出公車、捷運、台鐵、高鐵接下來的班次。</div>`;
    if (S.planLoading) h += `<div class="empty"><span class="spin"></span> 正在查「${esc(S.destText)}」的路線…</div>`;
    if (S.planErr) h += `<div class="err">${esc(S.planErr)}</div>`;
    const p = S.plan;
    if (p){
      h += `<div class="mute" style="margin-bottom:10px">目的地：${esc(p.to.name)}${S.located ? "" : "（起點：台北車站）"}</div>`;
      const list = (kind, title, color) => {
        const r = p[kind];
        let inner = !r.ok ? `<div class="err">${esc(r.e)}</div>`
          : r.v.length ? r.v.map((x, i) => routeCard(kind, x, i)).join("")
          : `<div class="empty">找不到合適的班次</div>`;
        return `<div class="sec"><h3><i style="background:${color}"></i>${title}<small>接下來 3 班・點選看路線</small></h3>${inner}</div>`;
      };
      h += list("bus", "公車", "var(--bus)");
      h += list("metro", "捷運（台北・桃園機捷・台中・高雄）", "var(--mrt)");
      h += railSec("tra", "台鐵", "var(--tra)", p.tra);
      h += railSec("thsr", "高鐵", "var(--hsr)", p.thsr);
    }
  }
  $("body").innerHTML = h;
  document.querySelectorAll("[data-route]").forEach(c => c.onclick = () => showRoute(c.dataset.route));
  document.querySelectorAll("[data-bike]").forEach(c => c.onclick = () => {
    const b = S.bikes.find(x => x.id === c.dataset.bike); if (!b) return;
    S.focusBike = b.id; map.panTo({lat: b.lat, lng: b.lon}); render();
  });
}

// ====== 互動 ======
function openSheet(big){ const s = $("sheet"); s.classList.remove("small"); s.classList.toggle("big", !!big); syncFab(); }
function syncFab(){
  const s = $("sheet");
  const h = s.classList.contains("small") ? "92px" : s.classList.contains("big") ? "86vh" : "42vh";
  document.documentElement.style.setProperty("--sheet-h", h);
  $("locBtn").style.display = s.classList.contains("big") ? "none" : "block";
}
$("grab").onclick = () => {
  const s = $("sheet");
  if (s.classList.contains("small")) { s.classList.remove("small"); }
  else if (s.classList.contains("big")) { s.classList.remove("big"); s.classList.add("small"); }
  else s.classList.add("big");
  syncFab();
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; openSheet($("sheet").classList.contains("big")); render(); });
$("form").onsubmit = e => { e.preventDefault(); const v = $("dest").value.trim(); if (v) { $("dest").blur(); doPlan(v); } };
$("locBtn").onclick = () => map && locate();
$("areaBtn").onclick = () => { const c = map.getCenter(); loadNear({lat: c.lat(), lon: c.lng()}); };

render();
loadGoogle();
</script>
</body>
</html>
