<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2230">
<title>台灣大眾運輸通</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ink:#1c2230; --mute:#6b7280; --line:#e6e1d6; --card:#fff; --bg:#f6f4ef;
  --bike:#f2a900; --bus:#0e9f8e; --mrt:#0070bd; --tra:#1f3a8a; --hsr:#e8590c; --walk:#2f855a;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:fixed;inset:0;background:#e5e3df}

/* 上方搜尋列 */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;z-index:5;pointer-events:none}
.search{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;gap:6px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.15);padding:6px}
.sugg{pointer-events:auto;max-width:560px;margin:6px auto 0;background:#fff;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:55vh;overflow-y:auto}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid #f0ede6;background:#fff;padding:11px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.sugg button:first-child{border-top:0}
.sugg button:active{background:#f6f4ef}
.sugg .ic{width:22px;text-align:center;flex:0 0 auto}
.sugg .t{flex:1;min-width:0}
.sugg .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .t small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .del{color:var(--mute);font-size:18px;padding:0 4px}
.sugg mark{background:none;color:var(--mrt);font-weight:700}
.search input{flex:1;min-width:0;border:0;font:inherit;font-size:16px;padding:10px 10px;outline:none;background:transparent}
.search button{border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
#micBtn{background:#f1efe9;color:var(--ink);width:44px;display:grid;place-items:center;flex:0 0 auto}
#micBtn.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 76px);z-index:8;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;display:none;max-width:90vw;text-align:center}
#goBtn{background:var(--ink);color:#fff;padding:0 16px}
.fab{position:fixed;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);font-size:20px;cursor:pointer}
#locBtn{bottom:calc(var(--sheet-h) + 12px)}
#areaBtn{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 74px);z-index:5;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:9px 16px;box-shadow:0 3px 12px rgba(0,0,0,.25);cursor:pointer;display:none}

/* 下方抽屜 */
:root{--sheet-h:42vh}
.sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:6;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.big{--sheet-h:86vh;height:86vh}
.sheet.small{height:92px}
.grab{padding:8px 0 4px;cursor:pointer;display:flex;justify-content:center}
.grab span{width:42px;height:5px;border-radius:3px;background:#cfc8b8}
.tabs{display:flex;gap:6px;padding:0 14px 10px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.body{flex:1;overflow-y:auto;padding:0 14px 20px;-webkit-overflow-scrolling:touch}
.sec{margin:6px 0 16px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 8px}
.sec h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sec h3 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.card.tap{cursor:pointer}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.row{display:flex;align-items:center;gap:10px}
.num{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;font-size:13px}
.steps .w{color:var(--mute)}
.eta{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin-top:8px}
.eta b{font-variant-numeric:tabular-nums}
.soon{color:var(--bad)}
.trains{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.trains td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.trains td:last-child{text-align:right}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
.err{color:var(--bad);font-size:13px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #ddd;border-top-color:var(--ink);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.notice{background:#fff7e6;border:1px solid #f5d9a8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}

/* 地圖上的 YouBike 標記 */
.bk{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--c);border-radius:999px;padding:2px 7px 2px 4px;font:700 12px/1.2 system-ui,sans-serif;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;cursor:pointer}
.bk .ic{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:11px}
.bk .sp{color:var(--mute);font-weight:500}
.busdot{width:14px;height:14px;border-radius:50%;background:var(--bus);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.2)}
.dest{font-size:28px;transform:translateY(4px)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{bottom:calc(var(--sheet-h) + 2px)!important}
#setup{position:fixed;inset:0;z-index:20;background:rgba(28,34,48,.55);display:none;padding:calc(env(safe-area-inset-top) + 20px) 16px 20px;overflow:auto}
.setupbox{max-width:480px;margin:0 auto;background:#fff;border-radius:18px;padding:20px}
.setupbox h2{margin:0 0 4px}
.setupbox label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.setupbox input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.sbtn{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
.sbtn.ghost{background:#f1efe9;color:var(--ink)}
#mapErr{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 80px);z-index:7;max-width:560px;margin:0 auto;background:#fff;border:2px solid var(--bad);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.15);display:none}
#mapErr b{color:var(--bad)}
#mapErr code{background:#f3f4f6;border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <form class="search" id="form">
    <input id="dest" placeholder="要去哪裡？例如：台中車站、高雄巨蛋" autocomplete="off" enterkeyhint="search">
    <button id="micBtn" type="button" title="語音輸入" aria-label="語音輸入"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg></button>
    <button id="goBtn" type="submit">出發</button>
  </form>
  <div class="sugg" id="sugg"></div>
</div>
<div id="mapErr"></div>
<div class="hint" id="hint"></div>
<button id="areaBtn">🔄 查這一區</button>
<button class="fab" id="locBtn" title="回到我的位置">◎</button>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"><span></span></div>
  <div class="tabs">
    <button data-t="near" class="on">附近</button>
    <button data-t="route">路線</button>
  </div>
  <div class="body" id="body"></div>
</div>



<script>
// ====== 金鑰與本機儲存 ======
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem("tt_" + k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem("tt_" + k, JSON.stringify(v)); } catch (e) {} },
};
// 金鑰放在 Cloudflare Worker，朋友不用填
const WORKER = "https://tw-transit-api.liyuan02.workers.dev";
let KEYS = {};
// 清掉過期的快取
try { for (const k of Object.keys(localStorage)) if (k.startsWith("tt_c_")) { const v = JSON.parse(localStorage.getItem(k)); if (!v || v.exp < Date.now()) localStorage.removeItem(k); } } catch (e) {}
async function lsCached(key, ttlSec, fn){
  const hit = LS.get("c_" + key);
  if (hit && hit.exp > Date.now()) return hit.val;
  const val = await fn();
  LS.set("c_" + key, {val, exp: Date.now() + ttlSec * 1000});
  return val;
}

// ====== 查詢引擎（TDX + Google Routes，直接從手機呼叫）======
const TDX = "https://tdx.transportdata.tw/api";

// ---------- 小工具 ----------
const cache = new Map();
async function cached(key, ttlSec, fn) {
  const hit = cache.get(key);
  if (hit && hit.exp > Date.now()) return hit.val;
  const val = await fn();
  cache.set(key, { val, exp: Date.now() + ttlSec * 1000 });
  return val;
}

function distM(aLat, aLon, bLat, bLon) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (bLat - aLat) * r, dLon = (bLon - aLon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const walkMin = m => Math.max(1, Math.round(m / 75)); // 每分鐘約 75 公尺

// 台北時間的日期與「幾點幾分」
function taipeiNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date()).map(x => [x.type, x.value]));
  const hh = p.hour === "24" ? 0 : +p.hour;
  return { date: `${p.year}-${p.month}-${p.day}`, minutes: hh * 60 + +p.minute };
}
const hmToMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

// ---------- TDX ----------
// TDX 免費會員每秒呼叫次數有限：所有請求排隊，每次間隔 TDX_GAP 毫秒
const TDX_GAP = 300;
const NEAR_M = 200; // 附近範圍（公尺）
let tdxCooldown = 0; // 被擋之後暫停到這個時間
let tdxQueue = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function tdxSlot() {
  const p = tdxQueue.then(() => sleep(TDX_GAP));
  tdxQueue = p.catch(() => {});
  return tdxQueue;
}

async function tdx(pathAndQuery) {
  if (Date.now() < tdxCooldown) throw new Error(`TDX 暫時限流，約 ${Math.ceil((tdxCooldown - Date.now()) / 1000)} 秒後自動恢復`);
  const url = WORKER + "/tdx" + pathAndQuery;
  for (let attempt = 0; attempt < 4; attempt++) {
    await tdxSlot();
    let res;
    try { res = await fetch(url); } catch (e) { throw new Error("連不到資料伺服器，請確認網路"); }
    if (res.status === 429) {           // 太頻繁：等一下再試
      if (attempt < 3) { await sleep(2000 * 2 ** attempt); continue; }   // 等 2、4、8 秒
      tdxCooldown = Date.now() + 60000;
      throw new Error("TDX 暫時限流，約 60 秒後自動恢復");
    }
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || `TDX 錯誤 ${res.status}`); }
    return res.json();
  }
}
const near = (lat, lon, r) => `$spatialFilter=nearby(${lat},${lon},${r})`;

// ---------- YouBike ----------
async function bikeNearby(lat, lon) {
  const key = `bike:${lat.toFixed(3)},${lon.toFixed(3)}`;
  return cached(key, 55, async () => {
    const [stations, avail] = await Promise.all([
      lsCached(`bikeSt2:${lat.toFixed(3)},${lon.toFixed(3)}`, 86400,
        () => tdx(`/advanced/v2/Bike/Station/NearBy?${near(lat, lon, NEAR_M + 150)}`)),
      tdx(`/advanced/v2/Bike/Availability/NearBy?${near(lat, lon, NEAR_M + 150)}`),
    ]);
    const byId = new Map(avail.map(a => [a.StationUID, a]));
    return stations.map(s => {
      const a = byId.get(s.StationUID) || {};
      const sLat = s.StationPosition.PositionLat, sLon = s.StationPosition.PositionLon;
      const d = distM(lat, lon, sLat, sLon);
      return {
        id: s.StationUID,
        name: (s.StationName?.Zh_tw || "").replace(/^YouBike2\.0_|^YouBike1\.0_/, ""),
        lat: sLat, lon: sLon,
        bikes: a.AvailableRentBikes ?? null,
        docks: a.AvailableReturnBikes ?? null,
        service: a.ServiceStatus ?? 1,
        dist: Math.round(d), walk: walkMin(d),
      };
    }).filter(b => b.dist <= NEAR_M).sort((x, y) => x.dist - y.dist);
  });
}

// ---------- 公車：附近站牌 + 到站時間 ----------
const CITY = {
  TPE: "Taipei", NWT: "NewTaipei", TAO: "Taoyuan", TXG: "Taichung", TNN: "Tainan", KHH: "Kaohsiung",
  KEE: "Keelung", HSZ: "Hsinchu", HSQ: "HsinchuCounty", MIA: "MiaoliCounty", CHA: "ChanghuaCounty",
  NAN: "NantouCounty", YUN: "YunlinCounty", CYQ: "ChiayiCounty", CYI: "Chiayi", PIF: "PingtungCounty",
  ILA: "YilanCounty", HUA: "HualienCounty", TTT: "TaitungCounty", KIN: "KinmenCounty",
  PEN: "PenghuCounty", LIE: "LienchiangCounty",
};

async function busNearby(lat, lon) {
  const key = `bus:${lat.toFixed(3)},${lon.toFixed(3)}`;
  return cached(key, 55, async () => {
    const stops = await lsCached(`busSt2:${lat.toFixed(3)},${lon.toFixed(3)}`, 86400,
      () => tdx(`/advanced/v2/Bus/Stop/NearBy?${near(lat, lon, NEAR_M + 150)}&$top=80`));

    // 以站名分組，取最近的 3 個站牌
    const groups = new Map();
    for (const s of stops) {
      const name = s.StopName?.Zh_tw || "";
      const d = distM(lat, lon, s.StopPosition.PositionLat, s.StopPosition.PositionLon);
      const g = groups.get(name) || { name, dist: Infinity, uids: [], lat: 0, lon: 0 };
      g.uids.push(s.StopUID);
      if (d < g.dist) Object.assign(g, { dist: d, lat: s.StopPosition.PositionLat, lon: s.StopPosition.PositionLon });
      groups.set(name, g);
    }
    const nearest = [...groups.values()].filter(g => g.dist <= NEAR_M).sort((a, b) => a.dist - b.dist).slice(0, 8);

    // 依縣市（或公路客運 THB）查到站時間
    const byCity = new Map();
    for (const g of nearest) for (const uid of g.uids) {
      const pre = uid.slice(0, 3);
      const k = pre === "THB" ? "InterCity" : CITY[pre];
      if (!k) continue;
      if (!byCity.has(k)) byCity.set(k, []);
      byCity.get(k).push(uid);
    }
    const etas = [];
    await Promise.all([...byCity].map(async ([city, uids]) => {
      const filter = encodeURIComponent(uids.map(u => `StopUID eq '${u}'`).join(" or "));
      const p = city === "InterCity"
        ? `/basic/v2/Bus/EstimatedTimeOfArrival/InterCity?$filter=${filter}`
        : `/basic/v2/Bus/EstimatedTimeOfArrival/City/${city}?$filter=${filter}`;
      try { etas.push(...await tdx(p)); } catch (e) { console.warn(e.message); }
    }));

    const STATUS = { 1: "尚未發車", 2: "交管不停靠", 3: "末班車已過", 4: "今日未營運" };
    return nearest.map(g => {
      const rows = etas.filter(e => g.uids.includes(e.StopUID)).map(e => ({
        route: e.RouteName?.Zh_tw || "",
        dir: e.Direction,
        min: e.EstimateTime != null ? Math.round(e.EstimateTime / 60) : null,
        status: e.EstimateTime != null ? null : (STATUS[e.StopStatus] || "無資料"),
      }));
      // 同一路線同方向只留一筆
      const uniq = new Map();
      for (const r of rows) {
        const k = r.route + "|" + r.dir;
        const old = uniq.get(k);
        if (!old || (r.min != null && (old.min == null || r.min < old.min))) uniq.set(k, r);
      }
      return {
        name: g.name, lat: g.lat, lon: g.lon,
        dist: Math.round(g.dist), walk: walkMin(g.dist),
        arrivals: [...uniq.values()].sort((a, b) => (a.min ?? 999) - (b.min ?? 999)),
      };
    });
  });
}

// ---------- 台鐵 / 高鐵：最近車站 + 接下來三班 ----------
async function traStations() {
  return lsCached("traSt", 86400, async () => {
    let j;
    try { j = await tdx("/basic/v3/Rail/TRA/Station"); }
    catch (e) { j = await tdx("/basic/v2/Rail/TRA/Station"); } // v3 失敗改用 v2
    return (j.Stations || j).map(s => ({
      id: s.StationID, name: s.StationName.Zh_tw,
      lat: s.StationPosition.PositionLat, lon: s.StationPosition.PositionLon,
    }));
  });
}
async function thsrStations() {
  return lsCached("thsrSt", 86400, async () => {
    const j = await tdx("/basic/v2/Rail/THSR/Station");
    return j.map(s => ({
      id: s.StationID, name: s.StationName.Zh_tw,
      lat: s.StationPosition.PositionLat, lon: s.StationPosition.PositionLon,
    }));
  });
}
function nearestStation(list, lat, lon) {
  let best = null;
  for (const s of list) {
    const d = distM(lat, lon, s.lat, s.lon);
    if (!best || d < best.dist) best = { ...s, dist: Math.round(d) };
  }
  return best;
}

async function railNext3(kind, o, d) {
  const { date, minutes } = taipeiNow();
  const after = minutes + Math.min(walkMin(o.dist), 30); // 預留走到車站的時間（最多 30 分）
  if (kind === "tra") {
    const j = await cached(`traOD:${o.id}:${d.id}:${date}`, 600, async () => {
      try { return await tdx(`/basic/v3/Rail/TRA/DailyTrainTimetable/OD/${o.id}/to/${d.id}/${date}`); }
      catch (e) { // v3 失敗改用 v2，轉成同樣格式
        const v2 = await tdx(`/basic/v2/Rail/TRA/DailyTimetable/OD/${o.id}/to/${d.id}/${date}`);
        return { TrainTimetables: v2.map(t => ({
          TrainInfo: { TrainNo: t.DailyTrainInfo.TrainNo, TrainTypeName: t.DailyTrainInfo.TrainTypeName },
          StopTimes: [{ StationID: o.id, DepartureTime: t.OriginStopTime.DepartureTime, ArrivalTime: t.OriginStopTime.ArrivalTime },
                      { StationID: d.id, DepartureTime: t.DestinationStopTime.DepartureTime, ArrivalTime: t.DestinationStopTime.ArrivalTime }],
        })) };
      }
    });
    return (j.TrainTimetables || []).map(t => {
      const st = t.StopTimes || [];
      const a = st.find(x => x.StationID === o.id), b = st.find(x => x.StationID === d.id);
      return a && b ? {
        no: t.TrainInfo.TrainNo,
        type: (t.TrainInfo.TrainTypeName?.Zh_tw || "").replace(/\(.*\)/, ""),
        dep: a.DepartureTime.slice(0, 5), arr: b.ArrivalTime.slice(0, 5),
      } : null;
    }).filter(x => x && hmToMin(x.dep) >= after)
      .sort((x, y) => hmToMin(x.dep) - hmToMin(y.dep)).slice(0, 3);
  } else {
    const j = await cached(`thsrOD:${o.id}:${d.id}:${date}`, 600,
      () => tdx(`/basic/v2/Rail/THSR/DailyTimetable/OD/${o.id}/to/${d.id}/${date}`));
    return j.map(t => ({
      no: t.DailyTrainInfo.TrainNo, type: "高鐵",
      dep: t.OriginStopTime.DepartureTime.slice(0, 5),
      arr: t.DestinationStopTime.ArrivalTime.slice(0, 5),
    })).filter(x => hmToMin(x.dep) >= after)
      .sort((x, y) => hmToMin(x.dep) - hmToMin(y.dep)).slice(0, 3);
  }
}

async function railPlan(kind, from, to) {
  const list = kind === "tra" ? await traStations() : await thsrStations();
  const o = nearestStation(list, from.lat, from.lon);
  const d = nearestStation(list, to.lat, to.lon);
  const limit = kind === "tra" ? 8000 : 25000; // 離車站太遠就不建議
  if (!o || !d) return { note: "找不到車站資料" };
  if (o.id === d.id) return { note: "起訖最近的是同一站，不需要搭乘" };
  if (o.dist > limit || d.dist > limit) return { note: `起點或目的地離${kind === "tra" ? "台鐵" : "高鐵"}站太遠`, from: o, to: d };
  return { from: o, to: d, trains: await railNext3(kind, o, d) };
}

// 備援：用 OpenStreetMap 查地址座標
async function geocodeOSM(address) {
  const u = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&accept-language=zh-TW&q=" + encodeURIComponent(address);
  const j = await (await fetch(u)).json();
  if (!j.length) throw new Error(`找不到「${address}」，換個說法試試`);
  return { lat: +j[0].lat, lon: +j[0].lon, name: address };
}

const FIELD_MASK = [
  "routes.duration", "routes.polyline.encodedPolyline", "routes.legs.endLocation",
  "routes.legs.steps.travelMode", "routes.legs.steps.staticDuration",
  "routes.legs.steps.distanceMeters", "routes.legs.steps.transitDetails",
].join(",");

async function computeTransit(from, to, modes, departureTime) {
  const GOOGLE_SERVER_KEY = KEYS.google;
  if (!GOOGLE_SERVER_KEY) throw new Error("沒有 Google 金鑰（資料伺服器沒有回應）");
  const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "X-Goog-Api-Key": GOOGLE_SERVER_KEY,
      "X-Goog-FieldMask": FIELD_MASK,
    },
    body: JSON.stringify({
      origin: { location: { latLng: { latitude: from.lat, longitude: from.lon } } },
      destination: to.address ? { address: to.address } : { location: { latLng: { latitude: to.lat, longitude: to.lon } } },
      travelMode: "TRANSIT",
      computeAlternativeRoutes: true,
      departureTime: departureTime.toISOString(),
      languageCode: "zh-TW", regionCode: "TW",
      transitPreferences: { allowedTravelModes: modes },
    }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error("Google：" + (j.error?.message || `Routes API 錯誤 ${res.status}`));
  const routes = j.routes || [];
  const end = routes[0]?.legs?.[0]?.endLocation?.latLng;
  if (end && to.onEnd) to.onEnd(end);
  return routes;
}

const secs = s => parseInt(String(s || "0").replace("s", ""), 10) || 0;

// 把 Google 的一條路線整理成前端好顯示的格式
function summarize(route) {
  const steps = (route.legs || []).flatMap(l => l.steps || []);
  const parts = [];
  let walkBefore = 0, seenTransit = false, walkAfter = 0;
  for (const s of steps) {
    if (s.travelMode === "WALK") {
      const m = secs(s.staticDuration);
      if (!seenTransit) walkBefore += m; else walkAfter += m;
      if (parts.length && parts[parts.length - 1].kind === "walk") parts[parts.length - 1].sec += m;
      else parts.push({ kind: "walk", sec: m });
    } else if (s.transitDetails) {
      seenTransit = true; walkAfter = 0;
      const t = s.transitDetails, line = t.transitLine || {};
      parts.push({
        kind: "transit",
        vehicle: line.vehicle?.type || "",
        vehicleName: line.vehicle?.name?.text || "",
        line: line.nameShort || line.name || "",
        lineFull: line.name || "",
        color: line.color || null, textColor: line.textColor || null,
        headsign: t.headsign || "",
        from: t.stopDetails?.departureStop?.name || "",
        to: t.stopDetails?.arrivalStop?.name || "",
        dep: t.stopDetails?.departureTime || null,
        arr: t.stopDetails?.arrivalTime || null,
        stops: t.stopCount || 0,
      });
    }
  }
  const transits = parts.filter(p => p.kind === "transit");
  if (!transits.length) return null;
  const first = transits[0], last = transits[transits.length - 1];
  const arrive = last.arr ? new Date(new Date(last.arr).getTime() + walkAfter * 1000).toISOString() : null;
  return {
    firstDep: first.dep,
    firstLine: first.line, firstVehicle: first.vehicle,
    walkToStop: Math.round(walkBefore / 60),
    arrive, durationMin: Math.round(secs(route.duration) / 60),
    parts, polyline: route.polyline?.encodedPolyline || null,
  };
}

// 取得某種交通方式「接下來三班」：必要時把出發時間往後推再查一次
async function next3(from, to, modes, keep) {
  const out = [], seen = new Set();
  let t = new Date();
  for (let i = 0; i < 3 && out.length < 3; i++) {
    const routes = await computeTransit(from, to, modes, t);
    let latest = null;
    for (const r of routes) {
      const s = summarize(r);
      if (!s || !keep(s)) continue;
      const k = s.firstLine + "|" + s.firstDep;
      if (seen.has(k)) continue;
      seen.add(k); out.push(s);
      if (!latest || s.firstDep > latest) latest = s.firstDep;
    }
    if (!latest) break;
    t = new Date(new Date(latest).getTime() + 60000);
  }
  return out.sort((a, b) => (a.firstDep || "").localeCompare(b.firstDep || "")).slice(0, 3);
}

const METRO_TYPES = new Set(["SUBWAY", "METRO_RAIL", "LIGHT_RAIL", "TRAM", "MONORAIL"]);

async function plan(from, destText) {
  const settle = p => p.then(v => ({ ok: true, v }), e => ({ ok: false, e: e.message }));
  let to = null;
  const onEnd = ll => { if (!to) to = { lat: ll.latitude, lon: ll.longitude, name: destText }; };
  // 先查公車（用地址），順便拿到目的地座標
  const bus = await settle(next3(from, { address: destText, onEnd }, ["BUS"], s => s.firstVehicle === "BUS"));
  if (!to) {
    try { await computeTransit(from, { address: destText, onEnd }, ["BUS", "SUBWAY", "TRAIN", "LIGHT_RAIL", "RAIL"], new Date()); } catch (_) {}
  }
  if (!to) to = await geocodeOSM(destText);
  const [metro, tra] = await Promise.all([
    settle(next3(from, to, ["SUBWAY", "LIGHT_RAIL"], s => s.parts.some(p => METRO_TYPES.has(p.vehicle)))),
    settle(railPlan("tra", from, to)),
  ]);
  const thsr = await settle(railPlan("thsr", from, to));
  if (!bus.ok && !metro.ok && /Google/.test(bus.e)) throw new Error(bus.e);
  return { to, bus, metro, tra, thsr };
}

const GM_REASON = {

const MAP = {
  kind: null, g: null, l: null, objs: new Set(), moveCb: null, done: false,

  start(){
    if (KEYS.google) this.loadGoogle(); else this.useLeaflet();
  },

  loadGoogle(){
    let ok = false, failed = false;
    const fail = why => {
      if (ok || failed) return; failed = true;

    };
    window.gm_authFailure = () => fail(this.gmCode ? GM_REASON[this.gmCode] || this.gmCode : "金鑰被拒絕");
    const ce = console.error.bind(console);
    console.error = (...a) => { const m = a.map(String).join(" ").match(/(\w+MapError)/); if (m) this.gmCode = m[1]; ce(...a); };
    window.__gmReady = () => {
      try {
        this.kind = "google";
        const el = this.freshDiv();
        this.g = new google.maps.Map(el, {center: {lat: 25.0478, lng: 121.5170}, zoom: 16,
          disableDefaultUI: true, clickableIcons: false, gestureHandling: "greedy"});
        this.g.addListener("tilesloaded", () => { ok = true; });
        this.g.addListener("idle", () => this.moveCb && this.moveCb());
        this.defineOverlay();

    sc.async = true; sc.onerror = () => fail("下載不到 Google 地圖");
    document.head.appendChild(sc);
    setTimeout(() => { if (!ok) fail(this.gmCode ? GM_REASON[this.gmCode] || this.gmCode : "等太久沒有回應"); }, 10000);
  },

  useLeaflet(){
    if (!window.L){ notice("下載不到地圖程式，請確認網路後重新整理。"); return; }
    this.kind = "leaflet"; this.g = null;
    const el = this.freshDiv();
    this.l = L.map(el, {zoomControl: false}).setView([25.0478, 121.5170], 16);

    this.redraw();
    if (S.me) this.panTo(S.me.lat, S.me.lon);
    if (!this.done){ this.done = true; locate(); }
  },

  freshDiv(){
    const host = $("map"); host.innerHTML = "";
    const d = document.createElement("div"); d.style.cssText = "position:absolute;inset:0";
    host.appendChild(d); return d;
  },

  defineOverlay(){
    class HtmlOv extends google.maps.OverlayView {
      constructor(o){ super(); this.o = o;
        const d = this.div = document.createElement("div");
        d.style.cssText = `position:absolute;z-index:${1000 + (o.z || 0)}`;
        d.innerHTML = `<div style="transform:translate(-50%,${o.bottom ? "-100%" : "-50%"})" title="${esc(o.title || "")}">${o.html}</div>`;
        d.addEventListener("click", e => { e.stopPropagation(); o.click && o.click(); });
      }
      onAdd(){ this.getPanes().overlayMouseTarget.appendChild(this.div); google.maps.OverlayView.preventMapHitsAndGesturesFrom(this.div); }
      draw(){ const p = this.getProjection().fromLatLngToDivPixel(new google.maps.LatLng(this.o.lat, this.o.lng));
        if (p){ this.div.style.left = p.x + "px"; this.div.style.top = p.y + "px"; } }
      onRemove(){ this.div.remove(); }
    }
    this.HtmlOv = HtmlOv;
  },

  // 建立實際的地圖物件（換地圖引擎時會重建）
  build(o){
    if (o.type === "marker"){
      if (this.kind === "google") { const v = new this.HtmlOv(o); v.setMap(this.g); return () => v.setMap(null); }
      const icon = L.divIcon({className: "", iconSize: null,
        html: `<div style="transform:translate(-50%,${o.bottom ? "-100%" : "-50%"})" title="${esc(o.title || "")}">${o.html}</div>`});
      const m = L.marker([o.lat, o.lng], {icon, zIndexOffset: o.z || 0, keyboard: false}).addTo(this.l);
      m.on("click", () => o.click && o.click());
      return () => m.remove();
    } else {
      if (this.kind === "google") {
        const pl = new google.maps.Polyline({map: this.g, path: o.path.map(([a, b]) => ({lat: a, lng: b})), strokeColor: o.color, strokeWeight: 6, strokeOpacity: .9});
        return () => pl.setMap(null);
      }
      const pl = L.polyline(o.path, {color: o.color, weight: 6, opacity: .9}).addTo(this.l);
      return () => pl.remove();
    }
  },
  add(o){
    const w = {o, kill: null, remove: () => { w.kill && w.kill(); this.objs.delete(w); }, onClick: fn => { o.click = fn; return w; }};
    this.objs.add(w); if (this.kind) w.kill = this.build(o); return w;
  },
  redraw(){ for (const w of this.objs){ w.kill && w.kill(); w.kill = this.build(w.o); } },

  marker(lat, lng, html, title, z, bottom){ return this.add({type: "marker", lat, lng, html, title, z, bottom}); },
  line(path, color){ return this.add({type: "line", path, color}); },

  panTo(lat, lng, zoom){
    if (this.kind === "google"){ this.g.panTo({lat, lng}); if (zoom) this.g.setZoom(zoom); }
    else if (this.kind === "leaflet"){ zoom ? this.l.setView([lat, lng], zoom) : this.l.panTo([lat, lng]); }
  },
  fit(points, frac){
    const top = 90, bottom = window.innerHeight * frac;
    if (this.kind === "google"){
      const b = new google.maps.LatLngBounds(); points.forEach(([a, c]) => b.extend({lat: a, lng: c}));
      this.g.fitBounds(b, {top, bottom, left: 30, right: 30});
    } else if (this.kind === "leaflet"){
      this.l.fitBounds(points, {paddingTopLeft: [30, top], paddingBottomRight: [30, bottom]});
    }
  },
  center(){
    if (this.kind === "google"){ const c = this.g.getCenter(); return {lat: c.lat(), lng: c.lng()}; }
    const c = this.l.getCenter(); return {lat: c.lat, lng: c.lng};
  },
  zoom(){ return this.kind === "google" ? this.g.getZoom() : this.l.getZoom(); },
};

// Google 路線線條解碼
function decodePolyline(str){
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length){
    for (const k of [0, 1]){
      let r = 0, sh = 0, b;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const d = (r & 1) ? ~(r >> 1) : (r >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}

}

const VEH = {BUS:["🚌","var(--bus)"], INTERCITY_BUS:["🚌","var(--bus)"], TROLLEYBUS:["🚌","var(--bus)"],
  SUBWAY:["🚇","var(--mrt)"], METRO_RAIL:["🚇","var(--mrt)"], LIGHT_RAIL:["🚊","var(--mrt)"], TRAM:["🚊","var(--mrt)"],
  HEAVY_RAIL:["🚆","var(--tra)"], COMMUTER_TRAIN:["🚆","var(--tra)"], RAIL:["🚆","var(--tra)"], HIGH_SPEED_TRAIN:["🚄","var(--hsr)"]};

const LINE_ZH = {
  "tamsui-xinyi": "淡水信義線", "bannan": "板南線", "songshan-xindian": "松山新店線", "zhonghe-xinlu": "中和新蘆線",
  "wenhu": "文湖線", "circular": "環狀線", "xinbeitou branch": "新北投支線", "xiaobitan branch": "小碧潭支線",
  "taoyuan airport mrt": "桃園機場捷運", "airport mrt": "桃園機場捷運", "taoyuan metro": "桃園機場捷運",
  "danhai lrt": "淡海輕軌", "danhai light rail": "淡海輕軌", "ankeng lrt": "安坑輕軌", "ankeng light rail": "安坑輕軌",
  "circular light rail": "環狀輕軌", "kaohsiung circular light rail": "環狀輕軌",
  "red line": "紅線", "orange line": "橘線", "green line": "綠線",
};
function zhLine(n){
  const k = String(n || "").toLowerCase().replace(/[\u2010-\u2015]/g, "-").replace(/\s*-\s*/g, "-").replace(/\s+line$/, "").trim();
  return LINE_ZH[k] || LINE_ZH[k + " line"] || n;
}
function stepsHtml(parts){
  return `<div class="steps">${parts.map(p => p.kind === "walk"
    ? (p.sec >= 60 ? `<span class="w">🚶${Math.round(p.sec/60)}分</span>` : "")
    : (() => { const [ic, c] = VEH[p.vehicle] || ["🚍","#555"];
        return `<span class="pill" style="background:${p.color || c};color:${p.textColor || "#fff"}">${ic} ${esc(zhLine(p.line))}</span>`; })()
  ).filter(Boolean).join(`<span class="w">›</span>`)}</div>`;
}

function routeCard(kind, r, i){
  const first = r.parts.find(p => p.kind === "transit");
  const m = minsFromNow(r.firstDep);
  const key = `${kind}:${i}`;
  return `<div class="card tap ${S.selected === key ? "sel" : ""}" data-route="${key}">
    <div class="row">
      <div><div class="num">${hm(r.firstDep)}</div><div class="mute">${rel(m)}開</div></div>
      <div style="flex:1">
        <div><b>${esc(zhLine(first.line))}</b> <span class="mute">往 ${esc(first.headsign || first.to)}</span></div>
        <div class="mute">走 ${r.walkToStop} 分鐘到「${esc(first.from)}」</div>
      </div>
      <div style="text-align:right"><div><b>${hm(r.arrive)}</b></div><div class="mute">到達</div></div>
    </div>
    ${stepsHtml(r.parts)}
    ${m < r.walkToStop ? `<div class="err" style="margin-top:6px">⚠️ 走過去可能趕不上</div>` : ""}
  </div>`;
}

function railSec(kind, title, color, res){
  let inner;
  if (!res) inner = "";
  else if (!res.ok) inner = `<div class="err">${esc(res.e)}</div>`;
  else if (res.v.note) inner = `<div class="empty">${esc(res.v.note)}</div>`;
  else {
    const {from, to, trains} = res.v;
    inner = `<div class="card">
      <div><b>${esc(from.name)}</b> → <b>${esc(to.name)}</b></div>
      <div class="mute">最近車站距你 ${(from.dist/1000).toFixed(1)} 公里（步行約 ${Math.round(from.dist/75)} 分）；目的地距 ${esc(to.name)} ${(to.dist/1000).toFixed(1)} 公里</div>
      ${trains.length ? `<table class="trains">${trains.map(t => `<tr>
        <td><b>${esc(t.dep)}</b> → ${esc(t.arr)}</td>
        <td class="mute">${esc(t.type)} ${esc(t.no)}次</td>
        <td class="mute">${rel(hmDiff(t.dep))}</td></tr>`).join("")}</table>`
        : `<div class="empty">今天已經沒有班次了</div>`}
    </div>`;
  }
  return `<div class="sec"><h3><i style="background:${color}"></i>${title}<small>接下來 3 班</small></h3>${inner}</div>`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === S.tab));
  let h = "";
  if (S.tab === "near"){
    if (S.locMsg && !S.located) h += `<div class="notice">📍 ${esc(S.locMsg)}</div>`;
    if (S.nearLoading) h += `<div class="empty"><span class="spin"></span> 讀取附近資料…</div>`;
    if (S.nearErr) h += `<div class="err">${esc(S.nearErr)}</div>`;
    // 公車
    h += `<div class="sec"><h3><i style="background:var(--bus)"></i>附近 ${NEAR_M} 公尺的公車站牌<small>每 60 秒更新</small></h3>`;
    h += S.buses.length ? S.buses.map(s => `<div class="card">
        <div class="row"><b style="flex:1">${esc(s.name)}</b><span class="mute">🚶 ${s.walk} 分（${s.dist} m）</span></div>
        ${s.arrivals.length ? `<div class="eta">${s.arrivals.slice(0, 8).map(a => `
          <span>${esc(a.route)}${s.arrivals.filter(x => x.route === a.route).length > 1 ? `<span class="mute">（${a.dir === 1 ? "返程" : "去程"}）</span>` : ""}</span>
          <b class="${a.min != null && a.min <= 3 ? "soon" : ""}">${a.min != null ? (a.min <= 1 ? "進站中" : a.min + " 分") : `<span class="mute">${esc(a.status)}</span>`}</b>`).join("")}</div>`
          : `<div class="empty">目前沒有到站資料</div>`}
      </div>`).join("") : (S.nearLoading ? "" : `<div class="empty">附近 ${NEAR_M} 公尺內沒有公車站</div>`);
    h += `</div>`;
    // YouBike
    h += `<div class="sec"><h3><i style="background:var(--bike)"></i>附近 ${NEAR_M} 公尺的 YouBike<small>可借 / 可還</small></h3>`;
    h += S.bikes.length ? S.bikes.map(b => `<div class="card ${S.focusBike === b.id ? "sel" : ""}" data-bike="${esc(b.id)}">
        <div class="row">
          <div style="flex:1"><b>${esc(b.name)}</b><div class="mute">🚶 ${b.walk} 分（${b.dist} m）${b.service !== 1 ? " · 暫停營運" : ""}</div></div>
          <div style="text-align:center"><div class="num" style="color:${bikeColor(b)}">${b.bikes ?? "?"}</div><div class="mute">可借</div></div>
          <div style="text-align:center"><div class="num">${b.docks ?? "?"}</div><div class="mute">空位</div></div>
        </div></div>`).join("") : (S.nearLoading ? "" : `<div class="empty">附近 ${NEAR_M} 公尺內沒有 YouBike 站</div>`);
    h += `</div>`;
  } else {
    if (!S.destText && !S.planLoading) h += `<div class="empty">在上方輸入目的地，就會列出公車、捷運、台鐵、高鐵接下來的班次。</div>`;
    if (S.planLoading) h += `<div class="empty"><span class="spin"></span> 正在查「${esc(S.destText)}」的路線…</div>`;
    if (S.planErr) h += `<div class="err">${esc(S.planErr)}</div>`;
    const p = S.plan;
    if (p){
      h += `<div class="mute" style="margin-bottom:10px">目的地：${esc(p.to.name)}${S.located ? "" : "（起點：台北車站）"}</div>`;
      const list = (kind, title, color) => {
        const r = p[kind];
        let inner = !r.ok ? `<div class="err">${esc(r.e)}</div>`
          : r.v.length ? r.v.map((x, i) => routeCard(kind, x, i)).join("")
          : `<div class="empty">找不到合適的班次</div>`;
        return `<div class="sec"><h3><i style="background:${color}"></i>${title}<small>接下來 3 班・點選看路線</small></h3>${inner}</div>`;
      };
      h += list("bus", "公車", "var(--bus)");
      h += list("metro", "捷運（台北・桃園機捷・台中・高雄）", "var(--mrt)");
      h += railSec("tra", "台鐵", "var(--tra)", p.tra);
      h += railSec("thsr", "高鐵", "var(--hsr)", p.thsr);
    }
  }
  h += `<div class="mute" style="text-align:center;margin-top:8px;font-size:12px">版本 ${VERSION}</div>`;
  $("body").innerHTML = h;
  document.querySelectorAll("[data-route]").forEach(c => c.onclick = () => showRoute(c.dataset.route));
  document.querySelectorAll("[data-bike]").forEach(c => c.onclick = () => {
    const b = S.bikes.find(x => x.id === c.dataset.bike); if (!b) return;
    S.focusBike = b.id; MAP.panTo(b.lat, b.lon); render();
  });
}

// ====== 互動 ======
function openSheet(big){ const s = $("sheet"); s.classList.remove("small"); s.classList.toggle("big", !!big); syncFab(); }
function syncFab(){
  const s = $("sheet");
  const h = s.classList.contains("small") ? "92px" : s.classList.contains("big") ? "86vh" : "42vh";
  document.documentElement.style.setProperty("--sheet-h", h);
  $("locBtn").style.display = s.classList.contains("big") ? "none" : "block";
}
$("grab").onclick = () => {
  const s = $("sheet");
  if (s.classList.contains("small")) { s.classList.remove("small"); }
  else if (s.classList.contains("big")) { s.classList.remove("big"); s.classList.add("small"); }
  else s.classList.add("big");
  syncFab();
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; openSheet($("sheet").classList.contains("big")); render(); });
// ====== 搜尋建議 ======
let suggSeq = 0, suggTimer, placesOK = true, sessTok = null;
const newTok = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
function hideSugg(){ $("sugg").style.display = "none"; $("sugg").innerHTML = ""; sessTok = null; }
function hl(text, q){
  const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? t : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
// 本機：搜尋紀錄 + 台鐵／高鐵車站
function localSugg(q){
  const out = [];
  for (const h of LS.get("hist") || []) if (!q || h.includes(q)) out.push({ic: "🕘", main: h, value: h, hist: true});
  if (q){
    const add = (key, ic, suf) => { for (const st of (LS.get("c_" + key)?.val || [])) if (st.name.includes(q)) out.push({ic, main: st.name + suf, value: st.name + suf}); };
    add("thsrSt", "🚄", "高鐵站"); add("traSt", "🚆", "車站");
  }
  return out;
}
// Google 地點建議（Places API New），失敗改用 OpenStreetMap Photon
async function remoteSugg(q){
  const me = S.me || {lat: 25.0478, lon: 121.517};
  if (KEYS.google && placesOK){
    try {
      sessTok = sessTok || newTok();
      const r = await fetch("https://places.googleapis.com/v1/places:autocomplete", {
        method: "POST",
        headers: {"content-type": "application/json", "X-Goog-Api-Key": KEYS.google},
        body: JSON.stringify({input: q, languageCode: "zh-TW", regionCode: "tw", includedRegionCodes: ["tw"], sessionToken: sessTok,
          locationBias: {circle: {center: {latitude: me.lat, longitude: me.lon}, radius: 30000}}}),
      });
      if (r.status === 403 || r.status === 400) { placesOK = false; throw new Error("places off"); }
      const j = await r.json();
      return (j.suggestions || []).filter(x => x.placePrediction).map(x => {
        const p = x.placePrediction, main = p.structuredFormat?.mainText?.text || p.text.text, sec = p.structuredFormat?.secondaryText?.text || "";
        return {ic: "📍", main, sub: sec.replace(/^台灣/, ""), value: (sec.replace(/^台灣/, "") + main) || p.text.text};
      });
    } catch (e) { /* 改用備援 */ }
  }
  try {
    const j = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${me.lat}&lon=${me.lon}`)).json();
    return (j.features || []).filter(f => f.properties.countrycode === "TW").map(f => {
      const p = f.properties, sub = [p.city || p.county, p.district, p.street].filter(Boolean).join(" ");
      return {ic: "📍", main: p.name || p.street || "", sub, value: (p.city || "") + (p.name || p.street || "")};
    }).filter(x => x.main);
  } catch (e) { return []; }
}
function showSugg(items, q){
  const box = $("sugg");
  const seen = new Set(); items = items.filter(x => !seen.has(x.main + "|" + (x.sub || "")) && seen.add(x.main + "|" + (x.sub || ""))).slice(0, 8);
  if (!items.length){ box.style.display = "none"; return; }
  box.innerHTML = items.map((x, i) => `<button type="button" data-i="${i}"><span class="ic">${x.ic}</span><span class="t"><b>${hl(x.main, q)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</span>${x.hist ? `<span class="del" data-del="${i}">×</span>` : ""}</button>`).join("");
  box.style.display = "block";
  box.querySelectorAll("button").forEach(b => b.onclick = e => {
    const x = items[+b.dataset.i];
    if (e.target.dataset.del != null){
      LS.set("hist", (LS.get("hist") || []).filter(h => h !== x.value)); e.stopPropagation();
      $("dest").focus(); updateSugg(); return;
    }
    $("dest").value = x.main; $("dest").blur(); doPlan(x.value);
  });
}
function updateSugg(){
  const q = $("dest").value.trim(), my = ++suggSeq;
  const local = localSugg(q);
  showSugg(local, q);
  clearTimeout(suggTimer);
  if (!q) return;
  suggTimer = setTimeout(async () => {
    const remote = await remoteSugg(q);
    if (my === suggSeq && document.activeElement === $("dest")) showSugg([...local.slice(0, 3), ...remote, ...local.slice(3)], q);
  }, 280);
}
$("dest").addEventListener("input", updateSugg);
$("dest").addEventListener("focus", updateSugg);
$("dest").addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== $("dest")) hideSugg(); }, 200));
$("map").addEventListener("pointerdown", hideSugg);

$("form").onsubmit = e => { e.preventDefault(); const v = $("dest").value.trim(); if (v) { $("dest").blur(); doPlan(v); } };
// ====== 語音輸入 ======
let hintTimer;
function hint(t, ms){ const h = $("hint"); h.textContent = t; h.style.display = t ? "block" : "none"; clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => h.style.display = "none", ms); }
(() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("micBtn");
  if (!SR){
    btn.onclick = () => { $("dest").focus(); hint("這個瀏覽器不支援，請用鍵盤上的麥克風說話", 3500); };
    return;
  }
  let rec = null;
  btn.onclick = () => {
    if (rec){ rec.stop(); return; }
    rec = new SR();
    rec.lang = "zh-TW"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let finalText = "";
    rec.onstart = () => { btn.classList.add("on"); hint("請說出目的地…"); };
    rec.onresult = e => {
      let txt = "";
      for (const r of e.results){ txt += r[0].transcript; if (r.isFinal) finalText = txt; }
      $("dest").value = txt.replace(/[。．.！!？?]$/, "");
    };
    rec.onerror = e => {
      const msg = {"not-allowed": "請允許使用麥克風（設定 → Safari → 麥克風）", "service-not-allowed": "請允許使用麥克風", "no-speech": "沒有聽到聲音，再試一次", "network": "語音辨識需要網路"}[e.error] || "語音辨識失敗：" + e.error;
      hint(msg, 3500);
    };
    rec.onend = () => {
      btn.classList.remove("on"); rec = null;
      const v = $("dest").value.trim();
      if (finalText && v){ hint("", 0); doPlan(v); }
      else if ($("hint").textContent === "請說出目的地…") hint("", 0);
    };
    try { rec.start(); } catch (e) { rec = null; hint("無法啟動麥克風", 3000); }
  };
})();

$("locBtn").onclick = () => locate();
$("areaBtn").onclick = () => { const c = MAP.center(); loadNear({lat: c.lat, lon: c.lng}); };

render();
(async () => {
  try {
    const r = await fetch(WORKER + "/config");
    if (!r.ok) throw new Error(r.status);
    KEYS = await r.json();
  } catch (e) {
    notice("連不到資料伺服器，地圖與查詢可能無法使用。");
  }
  initMap();
})();
</script>
