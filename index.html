<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2230">
<title>台灣大眾運輸通</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ink:#000; --mute:#2f3640; --line:#a9a294; --card:#fff; --bg:#ece8df;
  --bike:#f2a900; --bus:#0e9f8e; --mrt:#0070bd; --tra:#1f3a8a; --hsr:#e8590c; --walk:#2f855a;
  --ok:#0f7a33; --warn:#b45309; --bad:#c00000;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:fixed;inset:0;background:#e5e3df}

/* 上方搜尋列 */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;z-index:5;pointer-events:none}
.search{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;gap:6px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.15);padding:6px}
.sugg{pointer-events:auto;max-width:560px;margin:6px auto 0;background:#fff;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:55vh;overflow-y:auto}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid #f0ede6;background:#fff;padding:11px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.sugg button:first-child{border-top:0}
.sugg button:active{background:#f6f4ef}
.sugg .ic{width:22px;text-align:center;flex:0 0 auto}
.sugg .t{flex:1;min-width:0}
.sugg .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .t small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .del{color:var(--mute);font-size:18px;padding:0 4px}
.sugg mark{background:none;color:var(--mrt);font-weight:700}
.search input::placeholder{color:#4b5563}
.search input{flex:1;min-width:0;border:0;font:inherit;font-size:16px;padding:10px 10px;outline:none;background:transparent}
.search button{border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
#micBtn{background:#f1efe9;color:var(--ink);width:44px;display:grid;place-items:center;flex:0 0 auto}
#micBtn.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h) + 16px);z-index:8;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;display:none;max-width:90vw;text-align:center}
#goBtn{background:var(--ink);color:#fff;padding:0 16px}
.fab{position:fixed;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);font-size:20px;cursor:pointer}
#locBtn{bottom:calc(var(--sheet-h) + 12px)}
#langBtn{bottom:calc(var(--sheet-h) + 66px);font:700 14px/1 system-ui,sans-serif;color:var(--ink)}
#areaBtn{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 74px);z-index:5;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:9px 16px;box-shadow:0 3px 12px rgba(0,0,0,.25);cursor:pointer;display:none}

/* 下方抽屜 */
:root{--sheet-h:42vh}
.sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:6;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.big{--sheet-h:86vh;height:86vh}
.sheet.small{height:92px}
.grab{padding:8px 0 4px;cursor:pointer;display:flex;justify-content:center}
.grab span{width:42px;height:5px;border-radius:3px;background:#cfc8b8}
.tabs{display:flex;gap:6px;padding:0 14px 10px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.body{flex:1;overflow-y:auto;padding:0 14px 20px;-webkit-overflow-scrolling:touch}
.sec{margin:6px 0 16px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:0 0 7px}
.sec h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sec h3 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:auto}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px}
.card.tap{cursor:pointer}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.row{display:flex;align-items:center;gap:10px}
.num{font-size:28px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:13px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;font-size:13px}
.steps .w{color:var(--mute)}
.eta{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:15px;margin-top:6px;align-items:center}
.eta .rno{font-weight:600;margin-right:6px}
.eta .rends{color:var(--mute);font-size:12.5px;font-weight:500}
.eta b{font-variant-numeric:tabular-nums}
.eta .t{font-size:20px;font-weight:900;text-align:right;white-space:nowrap}
.eta .t small{font-size:13px;font-weight:700}
.eta .t.st{font-size:13px;font-weight:700;color:var(--mute)}
.soon{color:var(--bad)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:800;color:#fff;margin-left:6px;vertical-align:2px}
.tag.bad{background:var(--bad)}.tag.warn{background:var(--warn)}.tag.ok{background:var(--ok)}
.trains{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.trains td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.trains td:last-child{text-align:right}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
.err{color:var(--bad);font-size:13px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #ddd;border-top-color:var(--ink);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.notice{background:#fff7e6;border:1px solid #f5d9a8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}

/* 地圖上的 YouBike 標記 */
.bk{display:flex;align-items:center;gap:4px;background:#fff;border:2.5px solid var(--c);border-radius:999px;padding:2px 8px 2px 4px;font:800 14px/1.2 system-ui,sans-serif;color:#000;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;cursor:pointer}
.bk .ico{margin-left:-2px}
.bk .ic{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:11px}
.bk .sp{color:#333!important;font-weight:700!important}
.sp{color:var(--mute);font-weight:500}
.ico{display:inline-grid;place-items:center;border-radius:50%;flex:0 0 auto;vertical-align:middle}
.mk .ico{border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.sec h3 .ico{margin-right:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:2}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.all{padding-left:11px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-weight:500;opacity:.7}
.lines{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.lb{display:inline-block;border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700;color:#fff}
.busdot{width:14px;height:14px;border-radius:50%;background:var(--bus);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.me{position:relative;width:34px;height:34px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center}
.me::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:rgba(37,99,235,.18);animation:mepulse 2s ease-out infinite;z-index:-1}
@keyframes mepulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
.dest{font-size:28px;transform:translateY(4px)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{bottom:calc(var(--sheet-h) + 2px)!important}
#setup{position:fixed;inset:0;z-index:20;background:rgba(28,34,48,.55);display:none;padding:calc(env(safe-area-inset-top) + 20px) 16px 20px;overflow:auto}
.setupbox{max-width:480px;margin:0 auto;background:#fff;border-radius:18px;padding:20px}
.setupbox h2{margin:0 0 4px}
.setupbox label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.setupbox input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.sbtn{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
.sbtn.ghost{background:#f1efe9;color:var(--ink)}
@media (min-width: 820px){
  :root{--panel:420px}
  #map{left:var(--panel)!important}
  .top{right:auto;width:var(--panel);padding:12px 12px 0;z-index:8}
  .search{max-width:none}
  .sugg{max-width:none}
  .sheet,.sheet.big,.sheet.small{top:0;bottom:0;left:0;right:auto;width:var(--panel);height:auto!important;border-radius:0;padding-top:76px;box-shadow:2px 0 14px rgba(0,0,0,.12)}
  .grab{display:none}
  #locBtn{bottom:20px!important;display:block!important}
  #langBtn{bottom:74px!important;display:block!important}
  #areaBtn{left:calc(var(--panel) + (100vw - var(--panel)) / 2);top:16px}
  #mapErr{left:calc(var(--panel) + 16px);right:16px;transform:none;top:16px}
  .hint{left:calc(var(--panel) + (100vw - var(--panel)) / 2);bottom:24px!important}
  .leaflet-bottom{bottom:0!important}
}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.act{display:inline-flex;align-items:center;border:1.5px solid #000;background:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;font-weight:800;color:#000;text-decoration:none;cursor:pointer;line-height:1.3}
.act:active{background:#eee}
.act.main{background:#000;color:#fff}
.act.sub{border-color:#6b7280;color:#2f3640;font-weight:700}
#walkBar{position:fixed;left:12px;right:74px;top:calc(env(safe-area-inset-top) + 76px);z-index:7;display:none;align-items:center;gap:10px;background:#fff;border:2.5px solid #000;border-radius:16px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#walkBar.on{display:flex}
#walkBar .wt{font-size:28px;font-weight:900;line-height:1.1;white-space:nowrap}
#walkBar .wn{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#walkBar .wx{border:0;background:none;font-size:26px;font-weight:700;cursor:pointer;color:#000;padding:0 4px}
@media (min-width: 820px){ #walkBar{left:calc(var(--panel) + 16px);right:80px;top:16px;max-width:460px} }
#mtype{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:5;display:flex;flex-direction:column;background:#fff;border:2px solid #000;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#mtype button{border:0;border-top:1.5px solid #000;background:#fff;color:#000;font:800 13px/1 system-ui,"Noto Sans TC",sans-serif;padding:9px 8px;min-width:46px;cursor:pointer}
#mtype button:first-child{border-top:0}
#mtype button.on{background:#000;color:#fff}
#mtype.osm button:not([data-mt="road"]){display:none}
#compass{position:fixed;left:12px;right:74px;top:calc(env(safe-area-inset-top) + 76px);z-index:7;display:none;align-items:center;gap:12px;background:#fff;border:2.5px solid #000;border-radius:16px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#compass.on{display:flex}
#cmpArrow{flex:0 0 auto;transition:transform .25s ease-out}
#cmpName{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmpDist{font-size:28px;font-weight:900;line-height:1.1}
#cmpClose{position:absolute;top:2px;right:6px;border:0;background:none;font-size:24px;font-weight:700;cursor:pointer;color:#000}
@media (min-width: 820px){
  #mtype{top:16px}
  #compass{left:calc(var(--panel) + 16px);right:80px;top:16px;max-width:460px}
}
#mapErr{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 80px);z-index:7;max-width:560px;margin:0 auto;background:#fff;border:2px solid var(--bad);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.15);display:none}
#mapErr b{color:var(--bad)}
#mapErr code{background:#f3f4f6;border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <form class="search" id="form">
    <input id="dest" placeholder="要去哪裡？例如：台中車站、高雄巨蛋" autocomplete="off" enterkeyhint="search">
    <button id="micBtn" type="button" title="語音輸入" aria-label="語音輸入"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg></button>
    <button id="goBtn" type="submit">出發</button>
  </form>
  <div class="sugg" id="sugg"></div>
</div>
<div id="mapErr"></div>
<div class="hint" id="hint"></div>
<button id="areaBtn">🔄 查這一區</button>
<button class="fab" id="locBtn" title="回到我的位置">◎</button>
<button class="fab" id="langBtn" title="中文 / English">EN</button>
<div id="mtype">
  <button data-mt="road" class="on">一般</button><button data-mt="sat">衛星</button><button data-mt="3d">3D</button>
</div>
<div id="walkBar">
  <div style="flex:1;min-width:0"><div class="wn" id="walkName"></div><div class="wt" id="walkTime"></div><div class="mute" id="walkNote"></div></div>
  <a class="act sub" id="walkG" target="_blank" rel="noopener">Google ↗</a>
  <button class="wx" id="walkClose" aria-label="close">×</button>
</div>
<div id="compass">
  <button id="cmpClose" aria-label="close">×</button>
  <div id="cmpArrow"><svg viewBox="0 0 100 100" width="84" height="84"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#000" stroke-width="3"/><path d="M50 10 L72 70 L50 58 L28 70 Z" fill="#c00000" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div style="flex:1;min-width:0"><div id="cmpName"></div><div id="cmpDist"></div><div id="cmpNote" class="mute"></div></div>
</div>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"><span></span></div>
  <div class="tabs">
    <button data-t="near" class="on">附近</button>
    <button data-t="route">路線</button>
  </div>
  <div class="body" id="body"></div>
</div>



<script>
// ====== 金鑰與本機儲存 ======
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem("tt_" + k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem("tt_" + k, JSON.stringify(v)); } catch (e) {} },
};
// 金鑰放在 Cloudflare Worker，朋友不用填
const WORKER = "https://tw-transit-api.liyuan02.workers.dev";
let KEYS = {};
// ====== 語言（中文／English）======
const LANG = LS.get("lang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
const EN = LANG === "en";
const L = (zh, en) => EN ? en : zh;
const nm = (o, zhKey = "Zh_tw", enKey = "En") => (o ? (EN ? (o[enKey] || o[zhKey]) : o[zhKey]) : "") || "";
// 清掉過期的快取
try { for (const k of Object.keys(localStorage)) if (k.startsWith("tt_c_")) { const v = JSON.parse(localStorage.getItem(k)); if (!v || v.exp < Date.now()) localStorage.removeItem(k); } } catch (e) {}
async function lsCached(key, ttlSec, fn){
  const hit = LS.get("c_" + key);
  if (hit && hit.exp > Date.now()) return hit.val;
  const val = await fn();
  LS.set("c_" + key, {val, exp: Date.now() + ttlSec * 1000});
  return val;
}

// ====== 查詢引擎（TDX + Google Routes，直接從手機呼叫）======
const TDX = "https://tdx.transportdata.tw/api";

// ---------- 小工具 ----------
const cache = new Map();
async function cached(key, ttlSec, fn) {
  const hit = cache.get(key);
  if (hit && hit.exp > Date.now()) return hit.val;
  const val = await fn();
  cache.set(key, { val, exp: Date.now() + ttlSec * 1000 });
  return val;
}

function distM(aLat, aLon, bLat, bLon) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (bLat - aLat) * r, dLon = (bLon - aLon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const walkMin = m => Math.max(1, Math.round(m / 75)); // 每分鐘約 75 公尺

// 台北時間的日期與「幾點幾分」
function taipeiNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date()).map(x => [x.type, x.value]));
  const hh = p.hour === "24" ? 0 : +p.hour;
  return { date: `${p.year}-${p.month}-${p.day}`, minutes: hh * 60 + +p.minute };
}
const hmToMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

// ---------- TDX ----------
// TDX 免費會員每秒呼叫次數有限：所有請求排隊，每次間隔 TDX_GAP 毫秒
const TDX_GAP = 300;
const NEAR_M = 400; // 附近範圍（公尺）
let tdxCooldown = 0; // 被擋之後暫停到這個時間
let tdxQueue = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function tdxSlot() {
  const p = tdxQueue.then(() => sleep(TDX_GAP));
  tdxQueue = p.catch(() => {});
  return tdxQueue;
}

async function tdx(pathAndQuery) {
  if (Date.now() < tdxCooldown) throw new Error(L(`TDX 暫時限流，約 ${Math.ceil((tdxCooldown - Date.now()) / 1000)} 秒後自動恢復`, `TDX is rate-limited — retrying in about ${Math.ceil((tdxCooldown - Date.now()) / 1000)}s`));
  const url = WORKER + "/tdx" + pathAndQuery;
  for (let attempt = 0; attempt < 4; attempt++) {
    await tdxSlot();
    let res;
    try { res = await fetch(url); } catch (e) { throw new Error(L("連不到資料伺服器，請確認網路", "Can't reach the data server — check your connection")); }
    if (res.status === 429) {           // 太頻繁：等一下再試
      if (attempt < 3) { await sleep(2000 * 2 ** attempt); continue; }   // 等 2、4、8 秒
      tdxCooldown = Date.now() + 60000;
      throw new Error(L("TDX 暫時限流，約 60 秒後自動恢復", "TDX is rate-limited — retrying in about 60s"));
    }
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || `TDX 錯誤 ${res.status}`); }
    return res.json();
  }
}
const near = (lat, lon, r) => `$spatialFilter=nearby(${lat},${lon},${r})`;

// ---------- YouBike ----------
async function bikeNearby(lat, lon) {
  const key = `bike:${lat.toFixed(3)},${lon.toFixed(3)}`;
  return cached(key, 55, async () => {
    const [stations, avail] = await Promise.all([
      lsCached(`bikeSt3:${lat.toFixed(3)},${lon.toFixed(3)}`, 86400,
        () => tdx(`/advanced/v2/Bike/Station/NearBy?${near(lat, lon, NEAR_M + 150)}`)),
      tdx(`/advanced/v2/Bike/Availability/NearBy?${near(lat, lon, NEAR_M + 150)}`),
    ]);
    const byId = new Map(avail.map(a => [a.StationUID, a]));
    return stations.map(s => {
      const a = byId.get(s.StationUID) || {};
      const sLat = s.StationPosition.PositionLat, sLon = s.StationPosition.PositionLon;
      const d = distM(lat, lon, sLat, sLon);
      return {
        id: s.StationUID,
        name: nm(s.StationName).replace(/^YouBike\s?2\.0_|^YouBike\s?1\.0_/i, ""),
        lat: sLat, lon: sLon,
        bikes: a.AvailableRentBikes ?? null,
        docks: a.AvailableReturnBikes ?? null,
        service: a.ServiceStatus ?? 1,
        dist: Math.round(d), walk: walkMin(d),
      };
    }).filter(b => b.dist <= NEAR_M).sort((x, y) => x.dist - y.dist);
  });
}

// ---------- 公車：附近站牌 + 到站時間 ----------
const CITY = {
  TPE: "Taipei", NWT: "NewTaipei", TAO: "Taoyuan", TXG: "Taichung", TNN: "Tainan", KHH: "Kaohsiung",
  KEE: "Keelung", HSZ: "Hsinchu", HSQ: "HsinchuCounty", MIA: "MiaoliCounty", CHA: "ChanghuaCounty",
  NAN: "NantouCounty", YUN: "YunlinCounty", CYQ: "ChiayiCounty", CYI: "Chiayi", PIF: "PingtungCounty",
  ILA: "YilanCounty", HUA: "HualienCounty", TTT: "TaitungCounty", KIN: "KinmenCounty",
  PEN: "PenghuCounty", LIE: "LienchiangCounty",
};

async function busNearby(lat, lon) {
  const key = `bus:${lat.toFixed(3)},${lon.toFixed(3)}`;
  return cached(key, 55, async () => {
    const stops = await lsCached(`busSt3:${lat.toFixed(3)},${lon.toFixed(3)}`, 86400,
      () => tdx(`/advanced/v2/Bus/Stop/NearBy?${near(lat, lon, NEAR_M + 150)}&$top=80`));

    // 以站名分組，取最近的 3 個站牌
    const groups = new Map();
    for (const s of stops) {
      const name = nm(s.StopName);
      const d = distM(lat, lon, s.StopPosition.PositionLat, s.StopPosition.PositionLon);
      const g = groups.get(name) || { name, dist: Infinity, uids: [], lat: 0, lon: 0 };
      g.uids.push(s.StopUID);
      if (d < g.dist) Object.assign(g, { dist: d, lat: s.StopPosition.PositionLat, lon: s.StopPosition.PositionLon });
      groups.set(name, g);
    }
    const nearest = [...groups.values()].filter(g => g.dist <= NEAR_M).sort((a, b) => a.dist - b.dist).slice(0, 8);

    // 依縣市（或公路客運 THB）查到站時間
    const byCity = new Map();
    for (const g of nearest) for (const uid of g.uids) {
      const pre = uid.slice(0, 3);
      const k = pre === "THB" ? "InterCity" : CITY[pre];
      if (!k) continue;
      if (!byCity.has(k)) byCity.set(k, []);
      byCity.get(k).push(uid);
    }
    const etas = [];
    await Promise.all([...byCity].map(async ([city, uids]) => {
      const filter = encodeURIComponent(uids.map(u => `StopUID eq '${u}'`).join(" or "));
      const p = city === "InterCity"
        ? `/basic/v2/Bus/EstimatedTimeOfArrival/InterCity?$filter=${filter}`
        : `/basic/v2/Bus/EstimatedTimeOfArrival/City/${city}?$filter=${filter}`;
      try { etas.push(...await tdx(p)); } catch (e) { console.warn(e.message); }
    }));

    const routes = await routeEnds(etas);
    const STATUS = EN ? { 1: "Not departed", 2: "Not stopping", 3: "Last bus gone", 4: "No service today" } : { 1: "尚未發車", 2: "交管不停靠", 3: "末班車已過", 4: "今日未營運" };
    return nearest.map(g => {
      const rows = etas.filter(e => g.uids.includes(e.StopUID)).map(e => {
        const r = routes[e.RouteUID];
        // 依行駛方向排出「起點 → 終點」
        const ra = r ? (EN ? r.ae || r.a : r.a) : "", rb = r ? (EN ? r.be || r.b : r.b) : "";
        const ends = ra && rb ? (e.Direction === 1 ? [rb, ra] : [ra, rb]) : null;
        return {
        route: nm(e.RouteName),
        ends,
        dir: e.Direction,
        min: e.EstimateTime != null ? Math.round(e.EstimateTime / 60) : null,
        status: e.EstimateTime != null ? null : (STATUS[e.StopStatus] || L("無資料", "No data")),
      }; });
      // 同一路線同方向只留一筆
      const uniq = new Map();
      for (const r of rows) {
        const k = r.route + "|" + r.dir;
        const old = uniq.get(k);
        if (!old || (r.min != null && (old.min == null || r.min < old.min))) uniq.set(k, r);
      }
      return {
        name: g.name, lat: g.lat, lon: g.lon,
        dist: Math.round(g.dist), walk: walkMin(g.dist),
        arrivals: [...uniq.values()].sort((a, b) => (a.min ?? 999) - (b.min ?? 999)),
      };
    });
  });
}

// 公車路線的起點、終點（存在手機 7 天）
async function routeEnds(etas){
  const out = {}, need = new Map();
  for (const e of etas){
    if (!e.RouteUID || out[e.RouteUID]) continue;
    const c = LS.get("c_rt2:" + e.RouteUID);
    if (c && c.exp > Date.now()) { out[e.RouteUID] = c.val; continue; }
    const pre = e.RouteUID.slice(0, 3);
    const city = pre === "THB" ? "InterCity" : CITY[pre];
    if (!city) continue;
    if (!need.has(city)) need.set(city, new Set());
    need.get(city).add(e.RouteUID);
  }
  await Promise.all([...need].map(async ([city, set]) => {
    const uids = [...set].slice(0, 30);
    const filter = encodeURIComponent(uids.map(u => `RouteUID eq '${u}'`).join(" or "));
    const sel = "$select=RouteUID,DepartureStopNameZh,DestinationStopNameZh,DepartureStopNameEn,DestinationStopNameEn";
    const p = city === "InterCity" ? `/basic/v2/Bus/Route/InterCity?$filter=${filter}&${sel}` : `/basic/v2/Bus/Route/City/${city}?$filter=${filter}&${sel}`;
    try {
      for (const r of await tdx(p)) {
        const val = { a: r.DepartureStopNameZh || "", b: r.DestinationStopNameZh || "", ae: r.DepartureStopNameEn || "", be: r.DestinationStopNameEn || "" };
        out[r.RouteUID] = val;
        LS.set("c_rt2:" + r.RouteUID, { val, exp: Date.now() + 7 * 86400000 });
      }
      for (const u of uids) if (!out[u]) LS.set("c_rt2:" + u, { val: {}, exp: Date.now() + 86400000 }); // 查不到的也記一天
    } catch (e) { console.warn(e.message); }
  }));
  return out;
}

const METRO_OPS = ["TRTC", "NTMC", "TYMC", "TMRT", "KRTC", "KLRT", "NTDLRT", "NTALRT"];
const LINE_COLOR = {
  TRTC: { BL: "#0070bd", R: "#e3002c", G: "#008659", O: "#f8b61c", BR: "#c48c31", Y: "#fedb00" },
  NTMC: { Y: "#fedb00", V: "#e4782d", K: "#c3a274" },
  TYMC: { A: "#8246af" }, TMRT: { G: "#7cb342" },
  KRTC: { R: "#e2211c", O: "#f8a51b", C: "#7cbd52" }, KLRT: { C: "#7cbd52" },
  NTDLRT: { V: "#e4782d" }, NTALRT: { K: "#c3a274" },
};
async function metroStations(op) {
  const key = "mst:" + op, hit = LS.get("c_" + key);
  if (hit && hit.exp > Date.now()) return hit.val;
  let val;
  try {
    const j = await tdx(`/basic/v2/Rail/Metro/Station/${op}?$select=StationUID,StationID,StationName,StationPosition`);
    val = j.map(s => ({ id: s.StationID, op, name: s.StationName?.Zh_tw || "", nameEn: s.StationName?.En || "",
      lat: s.StationPosition?.PositionLat, lon: s.StationPosition?.PositionLon })).filter(s => s.lat);
  } catch (e) {
    if (!/40[04]/.test(e.message)) throw e;   // 只有「沒有這家業者」才當作空的
    val = [];
  }
  LS.set("c_" + key, { val, exp: Date.now() + 7 * 86400000 });
  return val;
}
async function metroNearby(lat, lon) {
  const all = [];
  for (const op of METRO_OPS) { try { all.push(...await metroStations(op)); } catch (e) { console.warn(op, e.message); } }
  const groups = new Map();
  for (const s of all) {
    const d = distM(lat, lon, s.lat, s.lon);
    if (d > NEAR_M) continue;
    const g = groups.get(s.name) || { name: s.name, nameEn: s.nameEn, lat: s.lat, lon: s.lon, dist: Infinity, lines: [] };
    const code = (String(s.id).match(/^[A-Z]+/) || [""])[0];
    if (!g.lines.some(x => x.code === code && x.op === s.op)) g.lines.push({ code, op: s.op, color: LINE_COLOR[s.op]?.[code] || "#0070bd", id: s.id });
    if (d < g.dist) Object.assign(g, { dist: d, lat: s.lat, lon: s.lon });
    groups.set(s.name, g);
  }
  return [...groups.values()].sort((a, b) => a.dist - b.dist)
    .map(g => ({ ...g, dist: Math.round(g.dist), walk: walkMin(g.dist), name: EN ? g.nameEn || g.name : g.name }));
}
// 台鐵、高鐵：離你最近的一站
async function railNearest(lat, lon) {
  const pick = async (fn) => {
    const s = nearestStation(await fn(), lat, lon);
    return s ? { ...s, name: EN ? s.nameEn || s.name : s.name, walk: walkMin(s.dist) } : null;
  };
  const tra = await pick(traStations).catch(e => ({ err: e.message }));
  const thsr = await pick(thsrStations).catch(e => ({ err: e.message }));
  return { tra, thsr };
}

async function thsrStations() {
  return lsCached("thsrSt2", 86400, async () => {
    const j = await tdx("/basic/v2/Rail/THSR/Station");
    return j.map(s => ({
      id: s.StationID, name: s.StationName.Zh_tw, nameEn: s.StationName.En || "",

function nearestStation(list, lat, lon) {
  let best = null;
  for (const s of list) {
    const d = distM(lat, lon, s.lat, s.lon);
    if (!best || d < best.dist) best = { ...s, dist: Math.round(d) };
  }
  return best;
}

async function railNext3(kind, o, d) {
  const { date, minutes } = taipeiNow();
  const after = minutes + Math.min(walkMin(o.dist), 30); // 預留走到車站的時間（最多 30 分）
  if (kind === "tra") {
    const j = await cached(`traOD:${o.id}:${d.id}:${date}`, 600, async () => {
      try { return await tdx(`/basic/v3/Rail/TRA/DailyTrainTimetable/OD/${o.id}/to/${d.id}/${date}`); }
      catch (e) { // v3 失敗改用 v2，轉成同樣格式
        const v2 = await tdx(`/basic/v2/Rail/TRA/DailyTimetable/OD/${o.id}/to/${d.id}/${date}`);
        return { TrainTimetables: v2.map(t => ({
          TrainInfo: { TrainNo: t.DailyTrainInfo.TrainNo, TrainTypeName: t.DailyTrainInfo.TrainTypeName },
          StopTimes: [{ StationID: o.id, DepartureTime: t.OriginStopTime.DepartureTime, ArrivalTime: t.OriginStopTime.ArrivalTime },
                      { StationID: d.id, DepartureTime: t.DestinationStopTime.DepartureTime, ArrivalTime: t.DestinationStopTime.ArrivalTime }],
        })) };
      }
    });
    return (j.TrainTimetables || []).map(t => {
      const st = t.StopTimes || [];
      const a = st.find(x => x.StationID === o.id), b = st.find(x => x.StationID === d.id);
      return a && b ? {
        no: t.TrainInfo.TrainNo,
        type: nm(t.TrainInfo.TrainTypeName).replace(/\(.*\)/, "").trim(),
        dep: a.DepartureTime.slice(0, 5), arr: b.ArrivalTime.slice(0, 5),
      } : null;
    }).filter(x => x && hmToMin(x.dep) >= after)
      .sort((x, y) => hmToMin(x.dep) - hmToMin(y.dep)).slice(0, 3);
  } else {
    const j = await cached(`thsrOD:${o.id}:${d.id}:${date}`, 600,
      () => tdx(`/basic/v2/Rail/THSR/DailyTimetable/OD/${o.id}/to/${d.id}/${date}`));
    return j.map(t => ({
      no: t.DailyTrainInfo.TrainNo, type: L("高鐵", "THSR"),
      dep: t.OriginStopTime.DepartureTime.slice(0, 5),
      arr: t.DestinationStopTime.ArrivalTime.slice(0, 5),
    })).filter(x => hmToMin(x.dep) >= after)
      .sort((x, y) => hmToMin(x.dep) - hmToMin(y.dep)).slice(0, 3);
  }
}

async function railPlan(kind, from, to) {
  const list = kind === "tra" ? await traStations() : await thsrStations();
  const o = nearestStation(list, from.lat, from.lon);
  const d = nearestStation(list, to.lat, to.lon);
  const limit = kind === "tra" ? 8000 : 25000; // 離車站太遠就不建議
  if (!o || !d) return { note: L("找不到車站資料", "No station data") };
  if (o.id === d.id) return { note: L("起訖最近的是同一站，不需要搭乘", "Same nearest station at both ends — no train needed") };
  if (o.dist > limit || d.dist > limit) return { note: L(`起點或目的地離${kind === "tra" ? "台鐵" : "高鐵"}站太遠`, `Start or destination is too far from a ${kind === "tra" ? "TRA" : "THSR"} station`), from: o, to: d };
  return { from: o, to: d, trains: await railNext3(kind, o, d) };
}

// 備援：用 OpenStreetMap 查地址座標
async function geocodeOSM(address) {
  const u = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&accept-language=${EN ? "en" : "zh-TW"}&q=` + encodeURIComponent(address);
  const j = await (await fetch(u)).json();
  if (!j.length) throw new Error(L(`找不到「${address}」，換個說法試試`, `Couldn't find "${address}" — try another name`));
  return { lat: +j[0].lat, lon: +j[0].lon, name: address };
}

const FIELD_MASK = [
  "routes.duration", "routes.polyline.encodedPolyline", "routes.legs.endLocation",
  "routes.legs.steps.travelMode", "routes.legs.steps.staticDuration",
  "routes.legs.steps.distanceMeters", "routes.legs.steps.transitDetails",
].join(",");

async function computeTransit(from, to, modes, departureTime) {
  const GOOGLE_SERVER_KEY = KEYS.google;
  if (!GOOGLE_SERVER_KEY) throw new Error(L("沒有 Google 金鑰（資料伺服器沒有回應）", "No Google key (data server not responding)"));
  const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "X-Goog-Api-Key": GOOGLE_SERVER_KEY,
      "X-Goog-FieldMask": FIELD_MASK,
    },
    body: JSON.stringify({
      origin: { location: { latLng: { latitude: from.lat, longitude: from.lon } } },
      destination: to.address ? { address: to.address } : { location: { latLng: { latitude: to.lat, longitude: to.lon } } },
      travelMode: "TRANSIT",
      computeAlternativeRoutes: true,
      departureTime: departureTime.toISOString(),
      languageCode: EN ? "en" : "zh-TW", regionCode: "TW",
      transitPreferences: { allowedTravelModes: modes },
    }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error("Google：" + (j.error?.message || `Routes API 錯誤 ${res.status}`));
  const routes = j.routes || [];
  const end = routes[0]?.legs?.[0]?.endLocation?.latLng;
  if (end && to.onEnd) to.onEnd(end);
  return routes;
}

const secs = s => parseInt(String(s || "0").replace("s", ""), 10) || 0;

// 把 Google 的一條路線整理成前端好顯示的格式
function summarize(route) {
  const steps = (route.legs || []).flatMap(l => l.steps || []);
  const parts = [];
  let walkBefore = 0, seenTransit = false, walkAfter = 0;
  for (const s of steps) {
    if (s.travelMode === "WALK") {
      const m = secs(s.staticDuration);
      if (!seenTransit) walkBefore += m; else walkAfter += m;
      if (parts.length && parts[parts.length - 1].kind === "walk") parts[parts.length - 1].sec += m;
      else parts.push({ kind: "walk", sec: m });
    } else if (s.transitDetails) {
      seenTransit = true; walkAfter = 0;
      const t = s.transitDetails, line = t.transitLine || {};
      parts.push({
        kind: "transit",
        vehicle: line.vehicle?.type || "",
        vehicleName: line.vehicle?.name?.text || "",
        line: line.nameShort || line.name || "",
        lineFull: line.name || "",
        color: line.color || null, textColor: line.textColor || null,
        headsign: t.headsign || "",
        from: t.stopDetails?.departureStop?.name || "",
        to: t.stopDetails?.arrivalStop?.name || "",
        dep: t.stopDetails?.departureTime || null,
        arr: t.stopDetails?.arrivalTime || null,
        stops: t.stopCount || 0,
      });
    }
  }
  const transits = parts.filter(p => p.kind === "transit");
  if (!transits.length) return null;
  const first = transits[0], last = transits[transits.length - 1];
  const arrive = last.arr ? new Date(new Date(last.arr).getTime() + walkAfter * 1000).toISOString() : null;
  return {
    firstDep: first.dep,
    firstLine: first.line, firstVehicle: first.vehicle,
    walkToStop: Math.round(walkBefore / 60),
    arrive, durationMin: Math.round(secs(route.duration) / 60),
    parts, polyline: route.polyline?.encodedPolyline || null,
  };
}

// 取得某種交通方式「接下來三班」：必要時把出發時間往後推再查一次
async function next3(from, to, modes, keep) {
  const out = [], seen = new Set();
  let t = new Date();
  for (let i = 0; i < 3 && out.length < 3; i++) {
    const routes = await computeTransit(from, to, modes, t);
    let latest = null;
    for (const r of routes) {
      const s = summarize(r);
      if (!s || !keep(s)) continue;
      const k = s.firstLine + "|" + s.firstDep;
      if (seen.has(k)) continue;
      seen.add(k); out.push(s);
      if (!latest || s.firstDep > latest) latest = s.firstDep;
    }
    if (!latest) break;
    t = new Date(new Date(latest).getTime() + 60000);
  }
  return out.sort((a, b) => (a.firstDep || "").localeCompare(b.firstDep || "")).slice(0, 3);
}

const METRO_TYPES = new Set(["SUBWAY", "METRO_RAIL", "LIGHT_RAIL", "TRAM", "MONORAIL"]);

async function plan(from, destText) {
  const settle = p => p.then(v => ({ ok: true, v }), e => ({ ok: false, e: e.message }));
  let to = null;
  const onEnd = ll => { if (!to) to = { lat: ll.latitude, lon: ll.longitude, name: destText }; };
  // 先查公車（用地址），順便拿到目的地座標
  const bus = await settle(next3(from, { address: destText, onEnd }, ["BUS"], s => s.firstVehicle === "BUS"));
  if (!to) {
    try { await computeTransit(from, { address: destText, onEnd }, ["BUS", "SUBWAY", "TRAIN", "LIGHT_RAIL", "RAIL"], new Date()); } catch (_) {}
  }
  if (!to) to = await geocodeOSM(destText);
  const [metro, tra] = await Promise.all([
    settle(next3(from, to, ["SUBWAY", "LIGHT_RAIL"], s => s.parts.some(p => METRO_TYPES.has(p.vehicle)))),
    settle(railPlan("tra", from, to)),
  ]);
  const thsr = await settle(railPlan("thsr", from, to));
  if (!bus.ok && !metro.ok && /Google/.test(bus.e)) throw new Error(bus.e);
  return { to, bus, metro, tra, thsr };
}

async function api(path){
  const u = new URL(path, location.href), q = u.searchParams;
  const lat = +q.get("lat"), lon = +q.get("lon");
  if (u.pathname.endsWith("/api/bike")) return bikeNearby(lat, lon);
  if (u.pathname.endsWith("/api/bus")) return busNearby(lat, lon);
  if (u.pathname.endsWith("/api/metro")) return metroNearby(lat, lon);
  if (u.pathname.endsWith("/api/railnear")) return railNearest(lat, lon);
  if (u.pathname.endsWith("/api/plan")) return plan({lat, lon}, q.get("to"));
  throw new Error("unknown " + path);
}

const GM_REASON = {

const MAP = {
  kind: null, g: null, l: null, objs: new Set(), moveCb: null, done: false,

  start(){

  },

  loadGoogle(){
    let ok = false, failed = false;
    const fail = why => {

        if (KEYS.mapId) Object.assign(opts, {mapId: KEYS.mapId, renderingType: "VECTOR", tiltInteractionEnabled: true, headingInteractionEnabled: true});
        this.g = new google.maps.Map(el, opts);

        this.g.addListener("idle", () => this.moveCb && this.moveCb());

  },

  useLeaflet(){

    this.l.on("moveend", () => this.moveCb && this.moveCb());
    this.l.on("dragstart", () => { followMe = false; });
    this.redraw();
    if (S.me) this.panTo(S.me.lat, S.me.lon);
    if (!this.done){ this.done = true; locate(); }
  },

  freshDiv(){
    const host = $("map"); host.innerHTML = "";
    const d = document.createElement("div"); d.style.cssText = "position:absolute;inset:0";
    host.appendChild(d); return d;
  },

  defineOverlay(){
    class HtmlOv extends google.maps.OverlayView {
      constructor(o){ super(); this.o = o;
        const d = this.div = document.createElement("div");
        d.style.cssText = `position:absolute;z-index:${1000 + (o.z || 0)}`;
        d.innerHTML = `<div style="transform:translate(-50%,${o.bottom ? "-100%" : "-50%"})" title="${esc(o.title || "")}">${o.html}</div>`;

      }
      onAdd(){ this.getPanes().overlayMouseTarget.appendChild(this.div); google.maps.OverlayView.preventMapHitsAndGesturesFrom(this.div); }
      draw(){ const p = this.getProjection().fromLatLngToDivPixel(new google.maps.LatLng(this.o.lat, this.o.lng));
        if (p){ this.div.style.left = p.x + "px"; this.div.style.top = p.y + "px"; } }

    }
    this.HtmlOv = HtmlOv;
  },

  // 建立實際的地圖物件（換地圖引擎時會重建）
  build(o){
    if (o.type === "marker"){
      if (this.kind === "google") { const v = new this.HtmlOv(o); v.setMap(this.g); return () => v.setMap(null); }
      const icon = window.L.divIcon({className: "", iconSize: null,
        html: `<div style="transform:translate(-50%,${o.bottom ? "-100%" : "-50%"})" title="${esc(o.title || "")}">${o.html}</div>`});

    } else {
      if (this.kind === "google") {

      }
      const pl = window.L.polyline(o.path, {color: o.color, weight: 6, opacity: .9}).addTo(this.l);

  },
  add(o){
    const w = {o, kill: null, remove: () => { w.kill && w.kill(); this.objs.delete(w); }, onClick: fn => { o.click = fn; return w; }};
    this.objs.add(w); if (this.kind) w.kill = this.build(o); return w;
  },
  redraw(){ for (const w of this.objs){ w.kill && w.kill(); w.kill = this.build(w.o); } },

  marker(lat, lng, html, title, z, bottom){ return this.add({type: "marker", lat, lng, html, title, z, bottom}); },
  line(path, color){ return this.add({type: "line", path, color}); },
  circle(lat, lng, radius){ return this.add({type: "circle", lat, lng, radius}); },

  // 地圖被上方搜尋列、下方清單擋住一部分；算出露出來那一塊的中心，比整個地圖中心高多少像素
  visibleOffset(){
    const H = window.innerHeight;
    if (matchMedia("(min-width: 820px)").matches) return 0;   // 寬螢幕：地圖在右邊，沒有被擋
    const top = document.querySelector(".top").getBoundingClientRect().bottom;
    const bottom = $("sheet").getBoundingClientRect().top;
    return H / 2 - (top + bottom) / 2;
  },
  // 把 (lat,lng) 放在露出來那一塊的正中央
  centerOn(lat, lng, zoom){
    if (!this.kind) return;
    const z = zoom || this.zoom();
    const mPerPx = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z);
    const dLat = this.visibleOffset() * mPerPx / 111320;
    this.panTo(lat - dLat, lng, zoom);
  },
  panTo(lat, lng, zoom){
    if (this.kind === "google"){ this.g.panTo({lat, lng}); if (zoom) this.g.setZoom(zoom); }
    else if (this.kind === "leaflet"){ zoom ? this.l.setView([lat, lng], zoom) : this.l.panTo([lat, lng]); }
  },
  fit(points, frac){
    const wide = matchMedia("(min-width: 820px)").matches;
    const top = wide ? 40 : 90, bottom = wide ? 40 : window.innerHeight * frac;
    if (this.kind === "google"){
      const b = new google.maps.LatLngBounds(); points.forEach(([a, c]) => b.extend({lat: a, lng: c}));

    } else if (this.kind === "leaflet"){
      this.l.fitBounds(points, {paddingTopLeft: [30, top], paddingBottomRight: [30, bottom]});
    }
  },
  center(){
    if (this.kind === "google"){ const c = this.g.getCenter(); return {lat: c.lat(), lng: c.lng()}; }
    const c = this.l.getCenter(); return {lat: c.lat, lng: c.lng};
  },
  zoom(){ return this.kind === "google" ? this.g.getZoom() : this.l.getZoom(); },

  // 只顯示你周圍 1 公里（在「附近」分頁）；查路線時解除
  limitOn: false, limitAt: null,
  limit(on){
    this.limitOn = on;
    if (!this.kind) return;
    const me = S.me;
    let bounds = null;
    if (on && me){
      const dLat = 1000 / 111320, dLon = 1000 / (111320 * Math.cos(me.lat * Math.PI / 180));
      bounds = {south: me.lat - dLat, north: me.lat + dLat, west: me.lon - dLon, east: me.lon + dLon};
      this.limitAt = {lat: me.lat, lon: me.lon};
    }
    if (this.kind === "google"){
      this.g.setOptions({minZoom: on ? 15 : null, restriction: bounds ? {latLngBounds: bounds, strictBounds: false} : null});
    } else {
      this.l.setMinZoom(on ? 15 : 0);
      this.l.setMaxBounds(bounds ? [[bounds.south, bounds.west], [bounds.north, bounds.east]] : null);
    }
  },
  // 走動時，範圍跟著你移動
  limitFollow(){
    if (this.limitOn && S.me && (!this.limitAt || distM(S.me.lat, S.me.lon, this.limitAt.lat, this.limitAt.lon) > 150)) this.limit(true);
  },

  // 一般／衛星／3D／街景
  type: "road",
  setType(t){
    if (this.kind !== "google"){ return; }
    const g = this.g;
    this.type = t;
    document.querySelectorAll("#mtype button").forEach(b => b.classList.toggle("on", b.dataset.mt === t));
    if (t === "road"){ g.setMapTypeId("roadmap"); g.setTilt(0); g.setHeading(0); }
    if (t === "sat"){ g.setMapTypeId("hybrid"); g.setTilt(0); g.setHeading(0); }
    if (t === "3d"){
      if (g.getZoom() < 17) g.setZoom(17);
      if (KEYS.mapId){ g.setMapTypeId("roadmap"); g.setTilt(67.5); }
      else { g.setMapTypeId("satellite"); g.setTilt(45); hint(L("還沒設定地圖 ID，先用衛星斜視；設定後會有立體建築", "No Map ID yet — showing tilted satellite instead"), 4000); }
      if (S.heading != null) g.setHeading(S.heading);
    }
  },
};

// Google 路線線條解碼
function decodePolyline(str){
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length){
    for (const k of [0, 1]){
      let r = 0, sh = 0, b;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const d = (r & 1) ? ~(r >> 1) : (r >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}

// 定位：持續追蹤、最高精準度（不用舊的位置）
var watchId = null, accCircle = null, lastNearAt = 0, followMe = true;
function locate(){
  followMe = true;
  if (S.me && S.located) MAP.centerOn(S.me.lat, S.me.lon, 16);
  if (!navigator.geolocation){ useFallback(L("此瀏覽器不支援定位", "This browser doesn't support location")); return; }
  if (watchId != null) return;   // 已經在追蹤了
  let first = true;
  watchId = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    S.me = {lat: c.latitude, lon: c.longitude};
    S.acc = Math.round(c.accuracy);
    S.located = true; S.locMsg = null;
    placeMe();
    S.fixAt = new Date();
    if (first){ first = false; MAP.centerOn(S.me.lat, S.me.lon, 16); setTimeout(() => followMe && MAP.centerOn(S.me.lat, S.me.lon), 800); if (S.tab === "near") MAP.limit(true); loadNear(S.me); lastNearAt = Date.now(); updateCompass(); return; }
    MAP.limitFollow();
    updateCompass();
    if (followMe) MAP.centerOn(S.me.lat, S.me.lon);
    // 走離上次查詢的地方超過 100 公尺，自動更新附近（最快 30 秒一次）
    if (S.area && distM(S.me.lat, S.me.lon, S.area.lat, S.area.lon) > 100 && Date.now() - lastNearAt > 30000 && Date.now() > tdxCooldown){
      lastNearAt = Date.now(); loadNear(S.me, true);
    }
    if (S.tab === "near") updateAcc();
  }, e => {
    if (!first) return;   // 追蹤途中短暫失敗就忽略
    watchId != null && navigator.geolocation.clearWatch(watchId); watchId = null;
    useFallback(e.code === 1 ? L("你沒有允許定位", "Location permission denied") : L("無法取得定位", "Couldn't get your location"));
  }, {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; locate(); }
});
function updateAcc(){
  const el = document.getElementById("accLine");
  if (el && S.acc != null) el.innerHTML = accText();
}
const accText = () => {
  const a = S.acc, q = a <= 15 ? ["#16a34a", L("很準", "good")] : a <= 50 ? ["#f59e0b", L("普通", "fair")] : ["#dc2626", L("不準", "poor")];
  const t = S.fixAt ? S.fixAt.toLocaleTimeString("zh-TW", {hour12: false}) : "";
  return `<span style="color:${q[0]}">●</span> ${L("定位誤差約", "Location accuracy ±")}${L(" ±", "")}${a} m（${q[1]}）${t ? `・${L("更新於", "updated")} ${t}` : ""}`;
};
function useFallback(msg){
  S.me = {lat: 25.0478, lon: 121.5170}; S.located = false; S.locMsg = msg + L("，先以台北車站為起點。", " — using Taipei Main Station as the start.");
  placeMe(); MAP.centerOn(S.me.lat, S.me.lon);
  loadNear(S.me);
}
function placeMe(){
  rm(meMarker); rm(accCircle); accCircle = null;
  if (S.located && S.acc) accCircle = MAP.circle(S.me.lat, S.me.lon, S.acc);
  meMarker = mk({lat: S.me.lat, lng: S.me.lon}, ICON.me(), L("我的位置", "My location"), 999);
}

// ====== 附近：YouBike + 公車 ======
async function loadNear(pt, quiet){
  S.area = pt; $("areaBtn").style.display = "none";
  if (!quiet){ S.nearLoading = true; S.nearErr = null; render(); }
  const q = `lat=${pt.lat}&lon=${pt.lon}`;
  // 每一類讀到就先顯示，不用等全部
  const errs = new Set();
  if (!quiet) S.pending = new Set(["bike", "metro", "bus", "rail"]);
  const one = (kind, path, set) => api(path + "?" + q).then(v => { set(v); }, e => { errs.add(e.message); })
    .finally(() => { S.pending?.delete(kind); S.nearErr = [...errs].join("；") || null; drawNearMarkers(); render(); });
  await Promise.all([
    one("bike", "/api/bike", v => S.bikes = v),
    one("metro", "/api/metro", v => S.metros = v),
    one("bus", "/api/bus", v => S.buses = v),
    one("rail", "/api/railnear", v => S.railNear = v),
  ]);
  S.pending = new Set();
  S.nearLoading = false;
  drawNearMarkers(); render();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden && S.area && S.tab === "near" && Date.now() > tdxCooldown) loadNear(S.area, true); }, 60000);
}

function bikeColor(b){
  if (b.service !== 1) return "#6b7280";
  if (!b.bikes) return "#c00000";
  if (b.bikes < 3) return "#b45309";
  return "#0f7a33";
}
// YouBike 狀態文字（不只靠顏色）
function bikeTag(b){
  if (b.service !== 1) return `<span class="tag" style="background:#4b5563">${L("暫停營運", "Closed")}</span>`;
  if (b.bikes === 0) return `<span class="tag bad">${L("無車", "No bikes")}</span>`;
  if (b.docks === 0) return `<span class="tag bad">${L("滿位・無法還車", "Full · can't return")}</span>`;
  if (b.bikes != null && b.bikes < 3) return `<span class="tag warn">${L("車少", "Few bikes")}</span>`;

async function doPlan(text){
  if (!S.me){ return; }
  hideSugg();
  { const h = (LS.get("hist") || []).filter(x => x !== text); h.unshift(text); LS.set("hist", h.slice(0, 15)); }
  S.destText = text; S.tab = "route"; S.planLoading = true; S.plan = null; S.planErr = null; S.selected = null;
  if (walkDest) closeWalk();
  clearRoute(); openSheet(true); render(); MAP.limit(false);
  try {
    S.plan = await api(`/api/plan?lat=${S.me.lat}&lon=${S.me.lon}&to=${encodeURIComponent(text)}`);
    const t = S.plan.to;
    rm(destMarker);
    destMarker = mk({lat: t.lat, lng: t.lon}, ICON.dest(), t.name, 998, true);
    MAP.fit([[S.me.lat, S.me.lon], [t.lat, t.lon]], 0.5);
  } catch (e) { S.planErr = e.message; }
  S.planLoading = false; render();
}

function clearRoute(){ if (routeLine){ routeLine.remove(); routeLine = null; } }
function showRoute(key){
  clearRoute(); S.selected = key;
  const [kind, i] = key.split(":");
  const r = S.plan?.[kind]?.v?.[+i];
  if (r?.polyline){
    const path = decodePolyline(r.polyline);
    routeLine = MAP.line(path, kind === "bus" ? "#0e9f8e" : "#0070bd");
    MAP.fit(path, 0.45);
  }
  render();
}

let suggSeq = 0, suggTimer, placesOK = true, sessTok = null;
const newTok = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
function hideSugg(){ $("sugg").style.display = "none"; $("sugg").innerHTML = ""; sessTok = null; }
function hl(text, q){
  const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? t : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
// 本機：搜尋紀錄 + 台鐵／高鐵車站
function localSugg(q){
  const out = [];
  for (const h of LS.get("hist") || []) if (!q || h.includes(q)) out.push({ic: "🕘", main: h, value: h, hist: true});
  if (q){
    const add = (key, ic, suf, sufEn) => { for (const st of (LS.get("c_" + key)?.val || [])) {
      const n = EN ? st.nameEn || st.name : st.name;
      if (n.toLowerCase().includes(q.toLowerCase())) out.push({ic, main: n + L(suf, sufEn), value: st.name + suf});
    } };
    add("thsrSt2", "🚄", "高鐵站", " HSR Station"); add("traSt2", "🚆", "車站", " Station");
  }
  return out;
}
// Google 地點建議（Places API New），失敗改用 OpenStreetMap Photon
async function remoteSugg(q){
  const me = S.me || {lat: 25.0478, lon: 121.517};
  if (KEYS.google && placesOK){
    try {
      sessTok = sessTok || newTok();
      const r = await fetch("https://places.googleapis.com/v1/places:autocomplete", {
        method: "POST",
        headers: {"content-type": "application/json", "X-Goog-Api-Key": KEYS.google},
        body: JSON.stringify({input: q, languageCode: EN ? "en" : "zh-TW", regionCode: "tw", includedRegionCodes: ["tw"], sessionToken: sessTok,
          locationBias: {circle: {center: {latitude: me.lat, longitude: me.lon}, radius: 30000}}}),
      });
      if (r.status === 403 || r.status === 400) { placesOK = false; throw new Error("places off"); }
      const j = await r.json();
      return (j.suggestions || []).filter(x => x.placePrediction).map(x => {
        const p = x.placePrediction, main = p.structuredFormat?.mainText?.text || p.text.text, sec = p.structuredFormat?.secondaryText?.text || "";
        return {ic: "📍", main, sub: sec.replace(/^台灣/, ""), value: (sec.replace(/^台灣/, "") + main) || p.text.text};
      });
    } catch (e) { /* 改用備援 */ }
  }
  try {
    const j = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${me.lat}&lon=${me.lon}`)).json();
    return (j.features || []).filter(f => f.properties.countrycode === "TW").map(f => {
      const p = f.properties, sub = [p.city || p.county, p.district, p.street].filter(Boolean).join(" ");
      return {ic: "📍", main: p.name || p.street || "", sub, value: (p.city || "") + (p.name || p.street || "")};
    }).filter(x => x.main);
  } catch (e) { return []; }
}
function showSugg(items, q){
  const box = $("sugg");
  const seen = new Set(); items = items.filter(x => !seen.has(x.main + "|" + (x.sub || "")) && seen.add(x.main + "|" + (x.sub || ""))).slice(0, 8);
  if (!items.length){ box.style.display = "none"; return; }
  box.innerHTML = items.map((x, i) => `<button type="button" data-i="${i}"><span class="ic">${x.ic}</span><span class="t"><b>${hl(x.main, q)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</span>${x.hist ? `<span class="del" data-del="${i}">×</span>` : ""}</button>`).join("");
  box.style.display = "block";
  box.querySelectorAll("button").forEach(b => b.onclick = e => {
    const x = items[+b.dataset.i];
    if (e.target.dataset.del != null){
      LS.set("hist", (LS.get("hist") || []).filter(h => h !== x.value)); e.stopPropagation();
      $("dest").focus(); updateSugg(); return;
    }
    $("dest").value = x.main; $("dest").blur(); doPlan(x.value);
  });
}
function updateSugg(){
  const q = $("dest").value.trim(), my = ++suggSeq;
  const local = localSugg(q);
  showSugg(local, q);
  clearTimeout(suggTimer);
  if (!q) return;
  suggTimer = setTimeout(async () => {
    const remote = await remoteSugg(q);
    if (my === suggSeq && document.activeElement === $("dest")) showSugg([...local.slice(0, 3), ...remote, ...local.slice(3)], q);
  }, 280);
}
$("dest").addEventListener("input", updateSugg);
$("dest").addEventListener("focus", updateSugg);
$("dest").addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== $("dest")) hideSugg(); }, 200));
$("map").addEventListener("pointerdown", hideSugg);

$("form").onsubmit = e => { e.preventDefault(); const v = $("dest").value.trim(); if (v) { $("dest").blur(); doPlan(v); } };
// ====== 步行路線（直接畫在網頁地圖上）======
var walkLine = null, walkDest = null, walkSeq = 0;
async function walkRoute(from, to){
  const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
    method: "POST",
    headers: {"content-type": "application/json", "X-Goog-Api-Key": KEYS.google,
      "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline"},
    body: JSON.stringify({
      origin: {location: {latLng: {latitude: from.lat, longitude: from.lon}}},
      destination: {location: {latLng: {latitude: to.lat, longitude: to.lon}}},
      travelMode: "WALK", languageCode: EN ? "en" : "zh-TW", regionCode: "TW",
    }),
  });
  const j = await res.json();
  if (!res.ok || !j.routes?.length) throw new Error(j.error?.message || "no route");
  const r = j.routes[0];
  return {sec: secs(r.duration), m: r.distanceMeters || 0, path: decodePolyline(r.polyline.encodedPolyline)};
}
async function showWalk(name, lat, lon){
  if (!S.me) return;
  const my = ++walkSeq;
  closeCompass();
  walkDest = {name, lat, lon};
  $("walkName").textContent = "🚶 " + name;
  $("walkTime").innerHTML = `<span class="spin"></span>`;
  $("walkNote").textContent = L("計算步行路線中…", "Finding walking route…");
  $("walkG").href = gnav(lat, lon);
  $("walkBar").classList.add("on");
  followMe = false; MAP.limit(false);
  if (!matchMedia("(min-width: 820px)").matches) { const sh = $("sheet"); sh.classList.remove("big"); sh.classList.add("small"); syncFab(); }
  rm(walkLine); walkLine = null;
  let r;
  try { r = await walkRoute(S.me, walkDest); }
  catch (e) {
    // 算不出路線：先畫直線，用直線距離估算
    const d = distM(S.me.lat, S.me.lon, lat, lon);
    r = {sec: d / 75 * 60 * 1.3, m: Math.round(d * 1.3), path: [[S.me.lat, S.me.lon], [lat, lon]], rough: true};
  }
  if (my !== walkSeq) return;
  walkLine = MAP.line(r.path, "#1d4ed8");
  const min = Math.max(1, Math.round(r.sec / 60));
  $("walkTime").innerHTML = `${min}<small style="font-size:15px;margin-left:3px">${L("分鐘", "min")}</small><span style="font-size:17px;font-weight:800;margin-left:8px;white-space:nowrap">${r.m < 1000 ? r.m + " m" : (r.m / 1000).toFixed(1) + " km"}</span>`;
  $("walkNote").textContent = r.rough ? L("路線算不出來，先畫直線（時間是估計的）", "Couldn't get a route — showing a straight line (estimate)") : L("藍線是建議的步行路線", "Blue line is the suggested walking route");
  setTimeout(() => MAP.fit([[S.me.lat, S.me.lon], [lat, lon], ...r.path], 0.25), 350);
}
function closeWalk(){
  walkSeq++; walkDest = null;
  rm(walkLine); walkLine = null;
  $("walkBar").classList.remove("on");
  const sh = $("sheet"); if (sh.classList.contains("small")) { sh.classList.remove("small"); syncFab(); }
  if (S.tab === "near"){ followMe = true; MAP.limit(true); if (S.me) MAP.centerOn(S.me.lat, S.me.lon, 16); }
}
$("walkClose").onclick = closeWalk;
$("walkG").addEventListener("click", e => e.stopPropagation());

// ====== 指南針箭頭 ======
let cmpTarget = null, cmpAngle = 0, orientOn = false;
function bearing(aLat, aLon, bLat, bLon){
  const r = Math.PI / 180, y = Math.sin((bLon - aLon) * r) * Math.cos(bLat * r);
  const x = Math.cos(aLat * r) * Math.sin(bLat * r) - Math.sin(aLat * r) * Math.cos(bLat * r) * Math.cos((bLon - aLon) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;          // iPhone
  else if (e.absolute && typeof e.alpha === "number") h = (360 - e.alpha) % 360;        // Android
  if (h == null) return;
  h = (h + (screen.orientation?.angle || 0)) % 360;
  S.heading = h; updateCompass();
  if (MAP.kind === "google" && MAP.type === "3d" && KEYS.mapId && Date.now() - (onOrient.t || 0) > 500){ onOrient.t = Date.now(); MAP.g.setHeading(h); }
}
async function startOrientation(){
  if (orientOn) return;
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      const r = await DeviceOrientationEvent.requestPermission();   // iPhone 要先同意
      if (r !== "granted"){ hint(L("沒有允許使用指南針，箭頭會以北方朝上", "Compass not allowed — arrow uses north-up"), 4000); return; }
    }
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
    orientOn = true;
  } catch (e) { /* 不支援就用北方朝上 */ }
}
function closeCompass(){ cmpTarget = null; $("compass").classList.remove("on"); }
function startCompass(name, lat, lon){
  if (walkDest) closeWalk();
  cmpTarget = {name, lat, lon};
  $("compass").classList.add("on");
  $("cmpName").textContent = "🧭 " + name;
  startOrientation();
  updateCompass();
}
$("cmpClose").onclick = closeCompass;
function updateCompass(){
  if (!cmpTarget || !S.me) return;
  const d = distM(S.me.lat, S.me.lon, cmpTarget.lat, cmpTarget.lon);
  const b = bearing(S.me.lat, S.me.lon, cmpTarget.lat, cmpTarget.lon);
  const target = S.heading != null ? b - S.heading : b;
  let delta = ((target - cmpAngle) % 360 + 540) % 360 - 180;   // 轉最短的方向
  cmpAngle += delta;
  $("cmpArrow").style.transform = `rotate(${cmpAngle}deg)`;
  $("cmpDist").textContent = d < 1000 ? `${Math.round(d)} m` : `${(d / 1000).toFixed(1)} km`;
  $("cmpNote").textContent = d < 25 ? L("快到了！", "You're almost there!")
    : S.heading != null ? L(`手機平放，照箭頭方向走・約 ${walkMin(d)} 分鐘`, `Hold phone flat and follow the arrow · ~${walkMin(d)} min`)
    : L("沒有指南針資料：箭頭以地圖北方朝上為準", "No compass data: arrow is relative to north");
}

// ====== 語音輸入 ======
let hintTimer;
function hint(t, ms){ const h = $("hint"); h.textContent = t; h.style.display = t ? "block" : "none"; clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => h.style.display = "none", ms); }
(() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("micBtn");
  if (!SR){
    btn.onclick = () => { $("dest").focus(); hint(L("這個瀏覽器不支援，請用鍵盤上的麥克風說話", "Not supported here — use the keyboard's mic instead"), 3500); };
    return;
  }
  let rec = null;
  btn.onclick = () => {
    if (rec){ rec.stop(); return; }
    rec = new SR();
    rec.lang = EN ? "en-US" : "zh-TW"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let finalText = "";
    rec.onstart = () => { btn.classList.add("on"); hint(L("請說出目的地…", "Say your destination…")); };
    rec.onresult = e => {
      let txt = "";
      for (const r of e.results){ txt += r[0].transcript; if (r.isFinal) finalText = txt; }
      $("dest").value = txt.replace(/[。．.！!？?]$/, "");
    };
    rec.onerror = e => {
      const msg = (EN ? {"not-allowed": "Please allow microphone access (Settings → Safari → Microphone)", "service-not-allowed": "Please allow microphone access", "no-speech": "Didn't hear anything — try again", "network": "Speech recognition needs internet"}
        : {"not-allowed": "請允許使用麥克風（設定 → Safari → 麥克風）", "service-not-allowed": "請允許使用麥克風", "no-speech": "沒有聽到聲音，再試一次", "network": "語音辨識需要網路"})[e.error] || L("語音辨識失敗：", "Speech recognition failed: ") + e.error;
      hint(msg, 3500);
    };
    rec.onend = () => {
      btn.classList.remove("on"); rec = null;
      const v = $("dest").value.trim();
      if (finalText && v){ hint("", 0); doPlan(v); }
      else if ($("hint").textContent === L("請說出目的地…", "Say your destination…")) hint("", 0);
    };
    try { rec.start(); } catch (e) { rec = null; hint(L("無法啟動麥克風", "Couldn't start the microphone"), 3000); }
  };
})();

$("locBtn").onclick = () => locate();
$("areaBtn").onclick = () => { const c = MAP.center(); loadNear({lat: c.lat, lon: c.lng}); };

render();
// 套用介面文字
(() => {
  document.documentElement.lang = EN ? "en" : "zh-Hant";
  document.title = L("台灣大眾運輸通", "Taiwan Transit");
  $("dest").placeholder = L("要去哪裡？例如：台中車站、高雄巨蛋", "Where to? e.g. Taichung Station, Taipei 101");
  $("micBtn").title = $("micBtn").ariaLabel = L("語音輸入", "Voice input");
  $("goBtn").textContent = L("出發", "Go");
  $("areaBtn").textContent = L("🔄 查這一區", "🔄 Search this area");
  $("locBtn").title = L("回到我的位置", "My location");
  document.querySelector('.tabs [data-t="near"]').textContent = L("附近", "Nearby");
  document.querySelector('.tabs [data-t="route"]').textContent = L("路線", "Routes");
  $("langBtn").textContent = EN ? "中" : "EN";
  const mt = {road: L("一般", "Map"), sat: L("衛星", "Sat"), "3d": "3D"};
  document.querySelectorAll("#mtype button").forEach(b => b.textContent = mt[b.dataset.mt]);
  $("langBtn").onclick = () => { LS.set("lang", EN ? "zh" : "en"); location.reload(); };
})();

(async () => {
  try {
    const r = await fetch(WORKER + "/config");
    if (!r.ok) throw new Error(r.status);
    KEYS = await r.json();
  } catch (e) {
    notice(L("連不到資料伺服器，地圖與查詢可能無法使用。", "Can't reach the data server — map and search may not work."));
  }
  initMap();
})();
